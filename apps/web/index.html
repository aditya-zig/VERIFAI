<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="Run a bounded local repository check and read the evidence it produced." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2379AF96'/%3E%3C/svg%3E" />
  <title>Local repository check | VERIFAI</title>
  <style>
/* VERIFAI app shell. The brand palette (warm ground, orange accent, green mark)
   and the grotesk are kept. The screens follow the app-screen rules: flat
   surfaces with a 1px edge, one filled action, honest data states. */
:root {
  --bg: #fffaf5;
  --surface: #ffffff;
  --surface-2: #f4f1ec;
  --text: #2d2019;
  --muted: #5f534b;
  --muted-2: #786c64;
  --border: #e5ded7;
  --border-strong: #cfc4ba;
  --rule: #efeae4;
  --ink: #2d2019;
  --accent: #ff4f00;
  --accent-dark: #c33d00;
  --verified: #14713a;
  --verified-soft: #ebf8f0;
  --verified-edge: #caecd5;
  --failed: #b32f2b;
  --failed-soft: #fff0ef;
  --failed-edge: #f2cecb;
  --running: #1c56b8;
  --running-soft: #eef5ff;
  --running-edge: #cadcff;
  --warning: #8f5808;
  --warning-soft: #fff7e8;
  --warning-edge: #f0debb;
  --unknown: #5b6472;
  --unknown-soft: #f2f4f7;
  --unknown-edge: #e2e5ea;
  --shadow-float: 0 18px 44px rgba(45,32,25,.16);
  --radius-sm: 6px;
  --radius: 10px;
  --max: 1120px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
.fact dd, .lane-row, .event-row time { font-variant-numeric: tabular-nums; }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
.skip-link {
  position: fixed; left: max(16px, calc(50% - 560px)); top: -48px; z-index: 1000;
  padding: 10px 14px; border-radius: 8px; background: var(--ink); color: #fff;
}
.skip-link:focus { top: 16px; }
:focus-visible { outline: 2px solid var(--accent-dark); outline-offset: 2px; }

/* Header */
.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.header-inner {
  width: min(var(--max), calc(100% - 48px)); margin: 0 auto; min-height: 60px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 0;
}
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 760; letter-spacing: -.02em; }
.brand-mark {
  width: 26px; height: 26px; flex: 0 0 auto; border-radius: 7px; display: inline-block;
  background: #79af96;
}
.header-nav {
  display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface-2);
  margin-left: auto;
}
.nav-link {
  padding: 6px 12px; border: 1px solid transparent; border-radius: 7px;
  font-size: 13px; font-weight: 640; color: var(--muted);
  transition: background .16s ease, color .16s ease, border-color .16s ease;
}
.nav-link:hover { color: var(--text); }
.nav-link.active { background: var(--surface); color: var(--text); border-color: var(--border); }
.header-actions { display: flex; align-items: center; gap: 10px; }
.scope-chip {
  font-size: 12px; color: var(--muted); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px 9px; white-space: nowrap;
}

/* Page */
.page { width: min(var(--max), calc(100% - 48px)); margin: 0 auto; padding: 30px 0 72px; }
.page-head { max-width: 74ch; margin-bottom: 22px; }
h1 { font-size: 30px; line-height: 1.15; letter-spacing: -.028em; margin: 6px 0 10px; }
h2 { font-size: 19px; line-height: 1.25; letter-spacing: -.015em; }
h3 { font-size: 16px; line-height: 1.3; }
h4 { font-size: 13px; font-weight: 700; color: var(--muted-2); }
.lede { color: var(--muted); font-size: 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.wrap-anywhere { overflow-wrap: anywhere; word-break: break-word; }

/* Surfaces */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  min-width: 0;
}
.pad { padding: 18px; }
.section { margin-top: 14px; }
.evidence-card { display: grid; gap: 10px; min-width: 0; }
.evidence-card > h4 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.evidence-note { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.55; }
.evidence-sub { margin: 2px 0 0; font-size: 12px; font-weight: 700; color: var(--muted-2); }
.result-root { display: grid; gap: 14px; min-width: 0; }
.result-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.result-head-text { min-width: 0; display: grid; gap: 6px; }
.result-title { font-size: 20px; letter-spacing: -.02em; }
.result-sub { color: var(--muted); font-size: 13px; }
.result-lede { color: var(--muted); font-size: 14px; max-width: 78ch; }
.result-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: baseline; gap: 5px; max-width: 100%;
  border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2);
  padding: 3px 10px; font-size: 12px; line-height: 1.35; color: var(--muted);
}
.chip b { color: var(--text); font-weight: 700; overflow-wrap: anywhere; }
.chip.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; } /* taste-skill-ignore: hashes, ids and commands stay monospace */

/* Facts */
.fact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 8px; margin: 0; }
.fact { min-width: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); padding: 8px 10px; }
.fact dt { margin: 0 0 3px; font-size: 11.5px; font-weight: 700; color: var(--muted-2); }
.fact dd { margin: 0; font-size: 13px; font-weight: 640; color: var(--text); overflow-wrap: anywhere; }
.fact dd.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; font-weight: 600; } /* taste-skill-ignore: hashes, ids and commands stay monospace */
.fact.good { border-color: var(--verified-edge); background: var(--verified-soft); }
.fact.bad { border-color: var(--failed-edge); background: var(--failed-soft); }
.fact.warn { border-color: var(--warning-edge); background: var(--warning-soft); }
.fact.good dt, .fact.good dd { color: var(--verified); }
.fact.bad dt, .fact.bad dd { color: var(--failed); }
.fact.warn dt, .fact.warn dd { color: var(--warning); }
.stage-facts { gap: 8px; }
.stage-facts .fact { background: var(--surface-2); }
.stage-facts .fact strong { font-weight: 700; font-size: 13px; }
.local-summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.local-summary-grid > div { min-width: 0; border-top: 1px solid var(--rule); padding-top: 7px; }
.local-summary-grid strong { font-size: 13px; font-weight: 680; overflow-wrap: anywhere; }

/* Status pills */
.status {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 9px;
  font-size: 12px; line-height: 1.3; font-weight: 720; border: 1px solid transparent; white-space: nowrap;
}
.status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.status.verified { color: var(--verified); background: var(--verified-soft); border-color: var(--verified-edge); }
.status.failed { color: var(--failed); background: var(--failed-soft); border-color: var(--failed-edge); }
.status.running { color: var(--running); background: var(--running-soft); border-color: var(--running-edge); }
.status.warning { color: var(--warning); background: var(--warning-soft); border-color: var(--warning-edge); }
.status.unknown { color: var(--unknown); background: var(--unknown-soft); border-color: var(--unknown-edge); }

/* Buttons */
.btn {
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  min-height: 38px; padding: 0 15px; border-radius: 8px; font-weight: 700; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: border-color .16s ease, background .16s ease, color .16s ease;
}
.btn:hover { border-color: #b7a99d; background: #fffdfa; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); }
.btn.primary:hover { background: #a83200; border-color: #a83200; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.sm { min-height: 32px; padding: 0 11px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Forms */
.form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.field-row { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
.label { font-weight: 700; }
.help { color: var(--muted); font-size: 13px; max-width: 78ch; }
.input, .textarea, .select {
  width: 100%; border: 1px solid var(--border-strong); background: var(--surface);
  border-radius: 8px; color: var(--text); padding: 0 12px;
}
.input, .select { height: 40px; }
.textarea { min-height: 110px; padding: 10px 12px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; } /* taste-skill-ignore: hashes, ids and commands stay monospace */
.form-note { color: var(--muted); font-size: 13px; }
.form-limits { color: var(--muted); font-size: 13px; border-top: 1px solid var(--rule); padding-top: 10px; }

/* Scope panels */
.scope-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0; }
.scope { display: grid; gap: 8px; align-content: start; }
.scope h2 { font-size: 14px; }
.scope-list { display: grid; gap: 7px; }
.scope-list li { position: relative; padding-left: 16px; color: var(--muted); font-size: 13px; }
.scope-list li::before { content: ''; position: absolute; left: 0; top: 8px; width: 6px; height: 1px; background: var(--border-strong); }
.scope-list.neg li::before { background: var(--failed-edge); }

/* Result blocks */
.artifact-list { display: grid; gap: 6px; }
.artifact-list li { min-width: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); padding: 7px 10px; }
.artifact-list .artifact-name { font-weight: 700; font-size: 13px; overflow-wrap: anywhere; }
.local-log-block { max-height: 240px; overflow: auto; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
details > summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 0; }
details > summary:hover { color: var(--text); }
.inline-link { color: var(--accent-dark); text-decoration: underline; text-underline-offset: 2px; }

/* Empty, error and busy states */
.empty-state {
  display: grid; gap: 6px; border: 1px dashed var(--border-strong); border-radius: var(--radius);
  background: var(--surface); padding: 22px;
}
.empty-title { font-weight: 700; }
.empty-note { color: var(--muted); font-size: 13px; max-width: 70ch; }
.error-block { border-color: var(--failed-edge); background: var(--failed-soft); display: grid; gap: 8px; }
.error-title { font-size: 16px; font-weight: 700; color: var(--failed); }
.error-text { font-size: 14px; color: var(--text); overflow-wrap: anywhere; }
.spinner-inline {
  display: inline-block; width: 11px; height: 11px; border-radius: 50%;
  border: 1.5px solid var(--running-edge); border-top-color: var(--running);
  animation: spin .8s linear infinite; vertical-align: -1px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.busy-row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }

/* Deep audit lanes */
.observation-list { display: grid; gap: 8px; }
.observation { border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); padding: 10px 12px; display: grid; gap: 4px; }
.observation-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.observation-check { font-weight: 700; font-size: 12.5px; }
.lane-list { border-top: 1px solid var(--border); }
.lane-row {
  display: grid; grid-template-columns: 150px 128px 1fr; gap: 12px; align-items: baseline;
  padding: 10px 0; border-bottom: 1px solid var(--rule);
}
.lane-name { font-weight: 660; font-size: 13.5px; }
.lane-meta { color: var(--muted); font-size: 12.5px; }
.lane-reason { color: var(--muted); font-size: 13px; min-width: 0; }
.lane-empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
.finding-list { display: grid; gap: 10px; }
.finding { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); padding: 12px 14px; display: grid; gap: 6px; }
.finding-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.finding-summary { font-weight: 660; font-size: 14px; }
.event-list { display: grid; gap: 6px; }
.event-row { display: grid; grid-template-columns: 118px 1fr; gap: 10px; font-size: 12.5px; color: var(--muted); }
.event-row time { color: var(--muted-2); white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; } /* taste-skill-ignore: hashes, ids and commands stay monospace */
.steer-row { display: grid; gap: 8px; }
.human-approval { display: grid; gap: 8px; border-top: 1px solid var(--rule); padding-top: 12px; }
.failure-block { display: grid; gap: 4px; border-left: 3px solid var(--failed); padding: 4px 0 4px 10px; }
.human-approval h5 { font-size: 13px; font-weight: 700; }
.check-row { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--text); cursor: pointer; }
.check-row input { width: 16px; height: 16px; margin-top: 2px; flex: 0 0 auto; }

/* Toast */
.toast {
  position: fixed; right: 20px; bottom: 20px; background: var(--ink); color: #fff;
  border-radius: 8px; padding: 11px 14px; box-shadow: var(--shadow-float); /* taste-skill-ignore: the toast floats above the page */
  opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s ease;
  z-index: 100; max-width: 340px;
}
.toast.show { opacity: 1; transform: none; }

@media (max-width: 860px) {
  .scope-grid { grid-template-columns: 1fr; }
  .local-summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lane-row { grid-template-columns: 1fr; gap: 4px; }
}
@media (max-width: 640px) {
  .page, .header-inner { width: calc(100% - 32px); }
  .header-inner { padding: 10px 0; }
  .brand { order: 1; }
  .header-actions { order: 2; margin-left: auto; }
  .header-nav { order: 3; margin-left: 0; width: 100%; }
  .nav-link { flex: 1 1 0; text-align: center; }
  .fact-grid { grid-template-columns: 1fr; }
  .result-head { display: grid; }
  h1 { font-size: 24px; }
  /* the job first: the input and the start action sit above the scope detail */
  .page { display: flex; flex-direction: column; gap: 16px; }
  .page > * { margin-top: 0; margin-bottom: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <main id="app" tabindex="-1"></main>
  <p id="appAnnouncement" class="visually-hidden" role="status" aria-live="polite"></p>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
(() => {
  const app = document.getElementById('app');
  const toast = document.getElementById('toast');

  const state = { screen: 'landing' };

  function escapeHtml(value) {
    return String(value)
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#039;');
  }

  function announce(message) {
    const node = document.getElementById('appAnnouncement');
    if (node) node.textContent = message;
  }

  /* ---------- presentation helpers (kept stable: the result tests extract them) ---------- */

  function resultTone(value) {
    return { Completed: 'verified', VerifiedRepair: 'verified', Running: 'running', Failed: 'failed', Incomplete: 'failed', RejectedRepair: 'failed' }[value] || 'unknown';
  }

  function factTone(value) {
    return { verified: 'good', failed: 'bad', running: 'warn' }[resultTone(value)] || '';
  }

  function resultBadge(value, label) {
    return `<span class="status ${resultTone(value)}">${escapeHtml(label || value || 'Unknown')}</span>`;
  }

  function chip(label, value) {
    if (value === undefined || value === null || value === '') return '';
    return `<span class="chip">${escapeHtml(label)} <b>${escapeHtml(value)}</b></span>`;
  }

  function monoChip(label, value) {
    if (!value) return '';
    return `<span class="chip mono">${escapeHtml(label)} <b>${escapeHtml(value)}</b></span>`;
  }

  function fact(label, value, tone, mono) {
    const shown = value === undefined || value === null || value === '' ? 'Missing' : value;
    return `<div class="fact${tone ? ` ${tone}` : ''}"><dt>${escapeHtml(label)}</dt><dd${mono ? ' class="mono"' : ''}>${escapeHtml(shown)}</dd></div>`;
  }

  function factGrid(facts) {
    const cells = facts.filter(Boolean);
    return cells.length ? `<dl class="fact-grid">${cells.join('')}</dl>` : '';
  }

  function evidenceCard(id, title, badge, body) {
    return `<section${id ? ` id="${escapeHtml(id)}"` : ''} class="card pad section evidence-card"><h4>${escapeHtml(title)}${badge || ''}</h4>${body}</section>`;
  }

  function sandboxDisplay(value) {
    if (value === true) return 'yes';
    if (value === false) return 'no';
    return 'Not reported';
  }

  function hashChip(label, full) {
    if (!full) return '';
    const prefix = String(full).slice(0, 12);
    return `${monoChip(label, prefix)}<code class="wrap-anywhere">${escapeHtml(String(full))}</code>`;
  }

  function stageRows(stages) {
    const order = ['clone', 'analysis', 'sandbox', 'execution', 'finding', 'cleanup'];
    const known = order.map(name => [name, (stages && stages[name]) || { status: 'Pending' }]);
    const extra = Object.entries(stages || {}).filter(([name]) => !order.includes(name));
    return known.concat(extra);
  }

  function localStageRows(stages) {
    return stageRows(stages).map(([name, stage]) => {
      const status = (stage && stage.status) || 'Pending';
      const tone = { Completed: 'good', Failed: 'bad', Incomplete: 'bad', Running: 'warn' }[status] || '';
      const busy = status === 'Running' ? ' <span class="spinner-inline" aria-hidden="true"></span>' : '';
      const detail = stage && stage.detail
        ? `<p class="evidence-note">${escapeHtml(stage.detail)}${Number.isFinite(stage.durationMs) ? ` · ${escapeHtml(String(stage.durationMs))} ms` : ''}</p>`
        : '';
      return `<li class="fact ${tone}"><strong>${escapeHtml(name)}: ${escapeHtml(status)}</strong>${busy}${detail}</li>`;
    }).join('');
  }

  function localAuditHeadline(run) {
    if (run.status === 'Running') return 'The clone, the model review, the sandbox command and the cleanup run in that order.';
    if (run.status === 'Completed') {
      const exit = Number.isInteger(run.execution && run.execution.exitCode)
        ? `The bounded command exited ${run.execution.exitCode} in the Docker sandbox.`
        : 'The bounded command finished.';
      const state_ = (run.finding && run.finding.assessment && run.finding.assessment.findingState) || 'Unconfirmed';
      return `${exit} The model hypothesis stays ${state_}, so nothing here is a verification of the claim.`;
    }
    const failed = run.failedStage || 'unknown';
    return `The run stopped at the ${failed} stage. Only the evidence below was produced.`;
  }

  /* ---------- shell ---------- */

  function brand() {
    return `<a class="brand" href="#/landing" data-nav="landing" aria-label="VERIFAI home"><span class="brand-mark" aria-hidden="true"></span><span>VERIFAI</span></a>`;
  }

  const SCREENS = {
    landing: { label: 'Local audit', docTitle: 'Local repository check | VERIFAI', render: renderLocalAuditScreen },
    'deep-audit': { label: 'Deep audit', docTitle: 'Deep audit | VERIFAI', render: renderDeepAuditScreen },
    'pr-verification': { label: 'PR verification', docTitle: 'PR verification | VERIFAI', render: renderPrVerificationScreen },
  };

  function appHeader() {
    const links = Object.keys(SCREENS).map(key => {
      const screen = SCREENS[key];
      const active = state.screen === key;
      return `<a class="nav-link${active ? ' active' : ''}" href="#/${key}" data-nav="${key}"${active ? ' aria-current="page"' : ''}>${escapeHtml(screen.label)}</a>`;
    }).join('');
    return `<header class="app-header"><div class="header-inner">
      ${brand()}
      <nav class="header-nav" aria-label="Verification modes">${links}</nav>
      <div class="header-actions"><span class="scope-chip">Local controller</span></div>
    </div></header>`;
  }

  /* ---------- local audit screen ---------- */

  function localRepositoryFormMarkup() {
    return `<form id="localRepositoryForm" class="card pad form" aria-describedby="localRepositoryHelp">
      <div class="field">
        <label class="label" for="localRepoUrl">Public GitHub repository URL</label>
        <input id="localRepoUrl" name="url" class="input" type="url" required autocomplete="url" placeholder="https://github.com/owner/repository" aria-describedby="localRepositoryHelp" />
        <p id="localRepositoryHelp" class="help">VERIFAI clones the public repository, sends the tracked files to one API-backed model, and runs one bounded read-only command in an on-demand Docker sandbox. The finding carries the executed evidence. This limited check is not full verification.</p>
        <p class="form-limits">A limited check. It does not run your test suite, does not review security, and repairs nothing.</p>
      </div>
      <div class="actions">
        <button id="startLocalAudit" class="btn primary" type="submit">Start local check</button>
        <span class="form-note">One clone, one model call, one command. The temporary clone is removed when the run ends.</span>
      </div>
    </form>`;
  }

  function renderLocalAuditScreen() {
    return `${appHeader()}
      <div class="page">
        <div class="page-head">
          <h1 id="localAuditTitle" tabindex="-1">Local repository check</h1>
          <p class="lede">The supported local path: clone a public repository, let one model read its tracked files, run one bounded command in a Docker sandbox, then read the evidence the run actually produced.</p>
        </div>
        ${localRepositoryFormMarkup()}
        <div id="localRepoResult" class="result-host section" role="region" aria-label="Check result">
          <div class="empty-state">
            <p class="empty-title">No check has run yet</p>
            <p class="empty-note">Paste a public repository URL above and start a check. The stage trace, the model hypothesis, the executed command and the cleanup facts land here.</p>
          </div>
        </div>
        <div class="scope-grid">
          <section class="card pad scope">
            <h2>This run does</h2>
            <ul class="scope-list">
              <li>Clone the public repository into a temporary directory</li>
              <li>Send the tracked files to one API-backed model for a hypothesis</li>
              <li>Run one bounded read-only command in a Docker sandbox</li>
              <li>Remove the temporary clone and the sandbox when the run ends</li>
            </ul>
          </section>
          <section class="card pad scope">
            <h2>This run does not</h2>
            <ul class="scope-list neg">
              <li>Run your test suite or a full security review</li>
              <li>Confirm the model's hypothesis</li>
              <li>Repair code or open a pull request on its own</li>
              <li>Keep anything behind after the cleanup</li>
            </ul>
          </section>
        </div>
        <p class="section muted small">The wider ten-lane engine run is on the <a class="inline-link" href="#/deep-audit" data-nav="deep-audit">Deep audit</a> screen.</p>
      </div>`;
  }

  function localProgressMarkup() {
    return `<section class="card pad result-root" aria-label="Check in progress">
      <div class="result-head">
        <div class="result-head-text">
          <h2 class="result-title">Check running</h2>
          <p class="result-lede">The clone, the model review, the sandbox command and the cleanup run in that order. The stage list updates as each stage reports.</p>
        </div>
        <p class="status running">Running</p>
      </div>
      <section class="evidence-card">
        <h4>Stages</h4>
        <ol id="localAuditStages" class="fact-grid stage-facts">${localStageRows(null)}</ol>
      </section>
    </section>`;
  }

  function localErrorMarkup(message, detail) {
    return `<section class="card pad error-block" role="alert">
      <p class="error-title">The check did not finish</p>
      <p class="error-text">${escapeHtml(message)}</p>
      ${detail ? `<p class="evidence-note">${escapeHtml(detail)}</p>` : ''}
      <div class="actions"><button class="btn" type="button" data-action="retry-local-audit">Run the check again</button></div>
    </section>`;
  }

  function localResultHead(run, statusText) {
    const tone = run.status === 'Running' ? 'running' : run.status === 'Completed' ? 'unknown' : 'failed';
    const name = (run.repository && run.repository.fullName) || 'Public GitHub repository';
    return `<div class="result-head">
        <div class="result-head-text">
          <h2 class="result-title wrap-anywhere">${escapeHtml(name)}</h2>
          <p class="result-lede">${escapeHtml(localAuditHeadline(run))}</p>
        </div>
        <p id="localAuditStatus" class="status ${tone}">${escapeHtml(statusText)}</p>
      </div>
      ${run.error ? `<div><p class="status failed wrap-anywhere">${escapeHtml(run.failedStage || 'run')}: ${escapeHtml(run.error)}</p></div>` : ''}
      ${run.status && run.status !== 'Running' && run.status !== 'Completed' ? `<div class="actions"><button class="btn sm" type="button" data-action="retry-local-audit">Run the check again</button></div>` : ''}`;
  }

  function localSummaryBlock(run) {
    const repair = run.repair;
    return `<section id="localSummary" class="card pad section evidence-card" aria-label="Run facts">
        <h4>Run facts${repair && repair.verdict ? resultBadge(repair.verdict, `Repair ${repair.verdict}`) : ''}</h4>
        <div class="result-chips">
          ${chip('Audit id', run.id || 'Missing')}
          ${chip('Commit', (run.repository && run.repository.commit) || 'Missing')}
          ${chip('Tracked files', String((run.files && run.files.count) != null ? run.files.count : 'Missing'))}
          ${chip('Model', run.model ? `${run.model.provider} · ${run.model.model}` : 'Missing')}
          ${chip('Duration', run.durationMs != null ? `${run.durationMs} ms` : 'Missing')}
        </div>
      </section>`;
  }

  function localStagesBlock(run) {
    return evidenceCard('localAuditStagesCard', 'Stages', '', `<ol id="localAuditStages" class="fact-grid stage-facts">${localStageRows(run.stages)}</ol>`);
  }

  function localFindingBlock(run) {
    const finding = run.finding;
    if (!finding) return '';
    const findingState = (finding.assessment && finding.assessment.findingState) || 'Unconfirmed';
    return `<section id="localHypothesis" class="card pad section">
        <h4>Model hypothesis · Unconfirmed (opinion, not verification)</h4>
        <h3 id="localFindingTitle" class="wrap-anywhere">${escapeHtml(finding.title)}</h3>
        <span id="localFindingSeverity" class="status warning">${escapeHtml(finding.severity)}</span>
        <p class="evidence-note">Confidence: Unconfirmed · finding state: ${escapeHtml(findingState)}</p>
        <p id="localFindingDescription" class="wrap-anywhere" style="white-space:pre-wrap">${escapeHtml(finding.description)}</p>
        <p id="localFindingEvidence">Evidence file: <code class="wrap-anywhere">${escapeHtml((finding.evidence && finding.evidence.file) || 'missing')}</code></p>
        ${finding.assessment && finding.assessment.reason ? `<p class="evidence-note wrap-anywhere">${escapeHtml(finding.assessment.reason)}</p>` : ''}
        ${run.model ? `<p class="evidence-note wrap-anywhere">Base model · ${escapeHtml(run.model.provider)} · ${escapeHtml(run.model.model)}</p>` : ''}
      </section>`;
  }

  function localExecutionBlock(run) {
    const execution = run.execution;
    if (!execution) return '';
    const stdoutText = execution.stdout || '';
    const stderrText = execution.stderr || '';
    const stdoutLines = stdoutText ? stdoutText.split('\n').length : 0;
    const stderrLines = stderrText ? stderrText.split('\n').length : 0;
    const scopeText = (run.finding && run.finding.assessment && run.finding.assessment.scope)
      || (run.finding && run.finding.executedCheck && run.finding.executedCheck.scope)
      || 'limited-check: single bounded command, not a test suite, not security verification';
    return `<section id="localExecutionEvidence" class="card pad section">
        <h4>Executed check (server-owned)</h4>
        <p class="evidence-note wrap-anywhere">${escapeHtml(scopeText)}</p>
        <p id="localExecutionSource" class="evidence-note wrap-anywhere">Source: ${escapeHtml(execution.source || 'Missing')}</p>
        <p class="evidence-note">Command</p>
        <pre class="local-log-block wrap-anywhere"><code class="wrap-anywhere">${escapeHtml(execution.command || 'missing')}</code></pre>
        <p>Exit: ${escapeHtml(String(execution.exitCode))} · ${escapeHtml(String(execution.durationMs))} ms · ${escapeHtml(execution.status)}</p>
        <p id="localSandboxEvidence" class="wrap-anywhere">Docker sandbox ${execution.sandbox && execution.sandbox.started === true ? 'started' : execution.sandbox && execution.sandbox.started === false ? 'not started' : 'status Not reported'} · ${execution.sandbox && execution.sandbox.removed === true ? 'Removed after execution' : execution.sandbox && execution.sandbox.removed === false ? 'Incomplete cleanup' : 'Cleanup Not reported'}</p>
        ${factGrid([
          fact('container', execution.sandbox && execution.sandbox.name, undefined, true),
          fact('started', sandboxDisplay(execution.sandbox && execution.sandbox.started)),
          fact('removed', sandboxDisplay(execution.sandbox && execution.sandbox.removed)),
          fact('memory', execution.sandbox && execution.sandbox.memoryBytes ? `${execution.sandbox.memoryBytes / 1048576} MiB limit` : 'Not reported'),
          fact('CPU', execution.sandbox && execution.sandbox.nanoCpus ? `${execution.sandbox.nanoCpus / 1e9} CPUs` : 'Not reported'),
          fact('privileged', sandboxDisplay(execution.sandbox && execution.sandbox.privileged)),
          fact('network', (execution.sandbox && execution.sandbox.network) || 'Not reported'),
        ])}
        <details><summary>stdout · ${stdoutText.length} chars · ${stdoutLines} lines</summary><pre class="local-log-block wrap-anywhere">${escapeHtml(execution.stdout || '(empty)')}</pre></details>
        <details><summary>stderr · ${stderrText.length} chars · ${stderrLines} lines</summary><pre class="local-log-block wrap-anywhere">${escapeHtml(execution.stderr || '(empty)')}</pre></details>
        ${execution.truncated ? '<p class="evidence-note">Output capped: showing tail only.</p>' : ''}
        <p class="wrap-anywhere">Executed-output SHA-256: <code class="wrap-anywhere">${escapeHtml(run.outputHash || 'missing')}</code></p>
      </section>`;
  }

  function localSpecialistBlock(run) {
    const specialist = run.specialists && run.specialists.results && run.specialists.results.find(item => item.id === 'security');
    if (!specialist) return '';
    return `<section id="localSecuritySpecialist" class="card pad section">
        <h4>Security specialist</h4>
        <p class="status ${specialist.status === 'Completed' ? 'unknown' : 'failed'}">${escapeHtml(specialist.status)}</p>
        ${specialist.model ? `<p class="wrap-anywhere">${escapeHtml(specialist.model.provider)} · ${escapeHtml(specialist.model.model)}</p>` : ''}
        ${specialist.error ? `<p class="status failed wrap-anywhere">${escapeHtml(specialist.error)}</p>` : ''}
        <p>${specialist.findings && specialist.findings.length || 0} persisted finding(s) · ${specialist.evidenceRefs && specialist.evidenceRefs.length || 0} evidence ref(s)</p>
      </section>`;
  }

  function localBrowserBlock(run) {
    const browser = run.browser;
    if (!browser) return '';
    const browserConsole = browser.consoleErrors || browser.console || [];
    const browserNetwork = browser.networkEvidence || browser.network || [];
    const KNOWN_CONSOLE_KEYS = ['method', 'level', 'text', 'message', 'url', 'location'];
    const MAX_BROWSER_ROWS = 20;
    const consoleShown = browserConsole.slice(0, MAX_BROWSER_ROWS);
    const consoleMarkup = consoleShown.map((entry, i) => {
      const log = entry && entry.params && entry.params.entry;
      const args = entry && entry.params && entry.params.args;
      const argumentText = Array.isArray(args) ? args.map(arg => (arg && arg.value != null ? arg.value : (arg && arg.description) || '')).join(' ') : undefined;
      const text = (entry && (entry.text ?? entry.message)) || (log && log.text) || argumentText || (typeof entry === 'string' ? entry : 'Missing text');
      const location = (entry && (entry.url ?? entry.location)) || (log && log.url) || (entry && entry.params && entry.params.stackTrace && entry.params.stackTrace.callFrames && entry.params.stackTrace.callFrames[0] && entry.params.stackTrace.callFrames[0].url) || 'Missing location';
      const level = (entry && (entry.level ?? entry.method)) || (log && log.level) || (entry && entry.params && entry.params.type) || 'Missing level';
      const rest = entry && typeof entry === 'object' ? Object.fromEntries(Object.entries(entry).filter(([k]) => !KNOWN_CONSOLE_KEYS.includes(k))) : null;
      const fullPretty = rest && Object.keys(rest).length ? JSON.stringify(rest, null, 2) : '';
      const pretty = fullPretty.slice(0, 2000);
      return `<div><p class="evidence-note wrap-anywhere">Row ${i + 1} · ${escapeHtml(String(level))}</p><p class="wrap-anywhere">${escapeHtml(String(text))}</p><p class="evidence-note wrap-anywhere">${escapeHtml(String(location))}</p>${pretty ? `<details><summary>Row ${i + 1} full fields</summary><pre class="local-log-block wrap-anywhere">${escapeHtml(pretty)}${fullPretty.length > 2000 ? '\n...[truncated]' : ''}</pre></details>` : ''}</div>`;
    }).join('');
    const consoleExtra = browserConsole.length > consoleShown.length ? `<p class="evidence-note">${browserConsole.length - consoleShown.length} more console rows not shown (showing ${consoleShown.length} of ${browserConsole.length}).</p>` : '';
    const networkShown = browserNetwork.slice(0, MAX_BROWSER_ROWS);
    const networkMarkup = networkShown.map((row, i) => {
      const status = (row && (row.status ?? (row.params && row.params.response && row.params.response.status))) || (row && row.response && row.response.status);
      const url = (row && (row.url ?? (row.params && row.params.request && row.params.request.url))) || (row && row.params && row.params.response && row.params.response.url) || (row && row.request && row.request.url);
      const method = (row && (row.method ?? (row.params && row.params.request && row.params.request.method))) || (row && row.request && row.request.method);
      const fullPretty = JSON.stringify(row == null ? null : row, null, 2);
      const pretty = fullPretty.slice(0, 2000);
      return `<div><p class="wrap-anywhere">${escapeHtml(url != null ? String(url) : 'Missing')}</p><p class="evidence-note wrap-anywhere">Status: ${escapeHtml(status != null ? String(status) : 'not-reported')}${method ? ` · ${escapeHtml(String(method))}` : ''}</p><details><summary>Row ${i + 1} full fields</summary><pre class="local-log-block wrap-anywhere">${escapeHtml(pretty)}${fullPretty.length > 2000 ? '\n...[truncated]' : ''}</pre></details></div>`;
    }).join('');
    const networkExtra = browserNetwork.length > networkShown.length ? `<p class="evidence-note">${browserNetwork.length - networkShown.length} more network rows not shown (showing ${networkShown.length} of ${browserNetwork.length}).</p>` : '';
    const browserCleanup = browser.cleanup && typeof browser.cleanup === 'object' ? browser.cleanup : null;
    const cleanupFact = (label, value) => `<div><span class="tiny muted">${escapeHtml(label)}</span><br><strong>${value === true ? 'true' : value === false ? 'false' : 'missing'}</strong></div>`;
    const browserAssertion = browser.assertion || (Array.isArray(browser.assertions) ? browser.assertions[0] : null);
    return `<section id="localBrowserJourney" class="card pad section">
        <h4>Browser journey <span class="status unknown">Fixture only</span></h4>
        <p class="wrap-anywhere">${escapeHtml(browser.status)} · Local integration fixture; not verification of the cloned application</p>
        ${browser.error ? `<p class="status failed wrap-anywhere">${escapeHtml(browser.error)}</p>` : ''}
        ${browserAssertion ? `<p class="wrap-anywhere">Click assertion: expected ${escapeHtml(String(browserAssertion.expected != null ? browserAssertion.expected : 'Missing'))} · observed ${escapeHtml(String(browserAssertion.observed != null ? browserAssertion.observed : 'Missing'))} · ${browserAssertion.passed === true ? 'Passed' : 'Incomplete'}</p>` : '<p class="evidence-note">Click assertion: Missing (not reported)</p>'}
        ${browser.screenshotRefs && browser.screenshotRefs[0] ? `<a class="btn sm wrap-anywhere" href="${escapeHtml(browser.screenshotRefs[0])}" target="_blank" rel="noopener">Open server screenshot (fixture scope only)</a>` : '<p>Screenshot: Missing (not captured)</p>'}
        <details><summary>Console rows (${browserConsole.length})</summary>${consoleMarkup || '<p class="evidence-note">No console rows reported.</p>'}${consoleExtra}</details>
        <details><summary>Network rows (${browserNetwork.length})</summary>${networkMarkup || '<p class="evidence-note">No network rows reported.</p>'}${networkExtra}</details>
        <div class="local-summary-grid">${cleanupFact('browserClosed', browserCleanup && browserCleanup.browserClosed)}${cleanupFact('profileRemoved', browserCleanup && browserCleanup.profileRemoved)}${cleanupFact('fixtureStopped', browserCleanup && browserCleanup.fixtureStopped)}</div>
        ${browserCleanup && browserCleanup.error ? `<p class="status failed wrap-anywhere">${escapeHtml(browserCleanup.error)}</p>` : ''}
      </section>`;
  }

  function localRepairBlock(run) {
    const repair = run.repair;
    const execution = run.execution;
    if (repair && repair.verdict === 'VerifiedRepair') {
      const coverageText = (repair.coverage && repair.coverage.label) || '';
      const repairFiles = Array.isArray(repair.changedFiles) ? repair.changedFiles : [];
      const repairFilesMarkup = repairFiles.length
        ? `<p class="evidence-sub">Changed files (${repairFiles.length})</p><ul class="artifact-list">${repairFiles.map(file => `<li><span class="artifact-name">${escapeHtml(file.path || 'missing')}</span>${file.beforeHash ? hashChip('before', file.beforeHash) : '<span class="evidence-note">before hash Missing</span>'}${file.afterHash ? hashChip('after', file.afterHash) : '<span class="evidence-note">after hash Missing</span>'}</li>`).join('')}</ul>`
        : '<p class="evidence-note">No changed file was recorded.</p>';
      const repairDiffMarkup = repair.diff
        ? `<details><summary>Diff · ${escapeHtml(String(repair.diff.length))} chars</summary><pre class="local-log-block wrap-anywhere">${escapeHtml(repair.diff.slice(0, 4000))}${repair.diff.length > 4000 ? '\n...[truncated]' : ''}</pre></details>`
        : '';
      return `<section id="localRepairAction" class="card pad section">
        <h4>Verified repair</h4>
        <p class="status verified">VerifiedRepair · before exit ${escapeHtml(String(repair.before && repair.before.exitCode))} · after exit ${escapeHtml(String(repair.after && repair.after.exitCode))}</p>
        <p class="tiny muted wrap-anywhere">Verified target: <code class="wrap-anywhere">${escapeHtml((repair.verifiedTarget && repair.verifiedTarget.command) || (repair.before && repair.before.command) || run.selectedCommand || '')}</code> · exit ${escapeHtml(String((repair.verifiedTarget && repair.verifiedTarget.exitCode) != null ? repair.verifiedTarget.exitCode : (repair.before && repair.before.exitCode) != null ? repair.before.exitCode : ''))}</p>
        ${repair.verifiedBaseCommitSha ? `<p class="tiny muted wrap-anywhere">Verified base: <code class="wrap-anywhere">${escapeHtml(repair.verifiedBaseCommitSha)}</code></p>` : '<p class="tiny muted wrap-anywhere">Verified base: Missing</p>'}
        <p class="tiny muted wrap-anywhere">Original unchanged: ${repair.originalUnchanged === true ? 'yes' : repair.originalUnchanged === false ? 'no' : 'Not reported'}</p>
        ${coverageText ? `<p class="tiny muted wrap-anywhere">${escapeHtml(coverageText)}</p>` : `<p class="tiny muted wrap-anywhere">Regressions run: ${escapeHtml(String((repair.regressions && repair.regressions.length) != null ? repair.regressions.length : 0))} · coverage Not reported (not assumed SAME-COMMAND)</p>`}
        ${repair.error ? `<p class="status failed wrap-anywhere">${escapeHtml(repair.error)}</p>` : ''}
        ${repairFilesMarkup}
        ${repairDiffMarkup}
        <p class="tiny muted">Review proof first. Creating a PR requires this explicit human action and revalidates the immutable repair, proof manifest, and remote base.</p>
        <div class="human-approval">
          <h5>Human approval</h5>
          <p class="evidence-note">A human token is needed twice: once to approve the repair, once to open the pull request. The token is sent as an Authorization header and is held in memory for this session only. It is never written to storage, a URL, the log or the page.</p>
          <label class="label" for="localApprovalToken">Human token</label>
          <input id="localApprovalToken" class="input" type="password" autocomplete="off" aria-describedby="localApprovalHelp" />
          <label class="check-row" for="localApprovalReviewed">
            <input id="localApprovalReviewed" type="checkbox" />
            <span>I reviewed the immutable proof and the patch above.</span>
          </label>
          <p id="localApprovalHelp" class="help">Approving and publishing are two separate actions. The approval is single use: if it goes stale the server rejects it and the repair has to be approved again.</p>
          <div class="actions">
            <button class="btn primary sm" type="button" data-action="approve-local-repair" data-audit-id="${escapeHtml(run.id)}">Approve repair</button>
            <button id="localCreatePr" class="btn sm" type="button" data-action="create-local-pr" data-audit-id="${escapeHtml(run.id)}" disabled>Create PR</button>
          </div>
          <div id="localApprovalState" role="status" aria-live="polite"></div>
        </div>
        <div id="localPrResult" role="status" aria-live="polite">${run.pullRequest && run.pullRequest.pullRequest && run.pullRequest.pullRequest.url ? `<a class="wrap-anywhere" href="${escapeHtml(run.pullRequest.pullRequest.url)}" target="_blank" rel="noopener">Open created PR</a>` : ''}</div>
      </section>`;
    }
    const repairable = execution && execution.status === 'Failed' && execution.sandbox && execution.sandbox.started === true
      && execution.executed !== false && execution.timedOut !== true && execution.aborted !== true
      && Number.isInteger(execution.exitCode) && execution.exitCode !== 0;
    if (!repairable) return '';
    return `<section id="localRepairAction" class="card pad section">
      <h4>Repair candidate</h4>
      <p class="evidence-note">Deliberate action only. Paste one bounded candidate patch; VERIFAI tests it in an isolated copy and never edits the original checkout.</p>
      <textarea id="localRepairPatch" rows="5" class="textarea" spellcheck="false" placeholder='{"files":[{"path":"file.js","expected":"old","replacement":"new"}]}'></textarea>
      <div class="actions"><button class="btn primary sm" data-action="repair-local-audit" data-audit-id="${escapeHtml(run.id)}">Verify repair</button></div>
      <div id="localRepairResult" role="status" aria-live="polite"></div>
    </section>`;
  }

  function localProofBlock(run) {
    const proof = run.proof;
    if (!proof) return '';
    if (proof.artifacts) {
      const proofPresent = proof.artifacts.filter(item => item.status === 'Present').length;
      const proofMissing = proof.artifacts.filter(item => item.status === 'Missing').length;
      const proofBadge = proofPresent > 0 && proofMissing === 0 ? ' <span class="status verified">Complete</span>' : proofPresent === 0 ? ' <span class="status failed">Missing</span>' : ' <span class="status warning">Partial</span>';
      return `<section id="localProofArtifacts" class="card pad section">
        <h4>Proof artifacts${proofBadge}</h4>
        <p class="tiny muted wrap-anywhere">Proof manifest <code class="wrap-anywhere">${escapeHtml((proof.manifest && proof.manifest.id) || 'missing')}</code></p>
        <p class="tiny muted wrap-anywhere">SHA-256 <code class="wrap-anywhere">${escapeHtml((proof.manifest && proof.manifest.sha256) || 'missing')}</code> · ${proofPresent} present · ${proofMissing} missing</p>
        <p class="tiny muted">Materialized server-owned report data is downloadable; this includes unconfirmed hypotheses, not independent proof of their claims. Missing steps stay labelled Missing.</p>
        <ul>${proof.artifacts.map(item => item.status === 'Present'
          ? `<li><span class="status verified">Present</span> ${escapeHtml(item.name)} · ${escapeHtml(item.path || '')} · <span>SHA-256</span> <code class="wrap-anywhere">${escapeHtml(item.sha256 || '')}</code> · <a class="wrap-anywhere" href="/api/local/audits/${encodeURIComponent(run.id)}/artifacts/${encodeURIComponent(item.path)}" target="_blank" rel="noopener">Download ${escapeHtml(item.name)}</a></li>`
          : `<li><span class="status unknown">Missing</span> ${escapeHtml(item.name)}${item.reason ? `: ${escapeHtml(item.reason)}` : ''}</li>`).join('')}</ul>
      </section>`;
    }
    return `<section id="localProofArtifacts" class="card pad section">
      <h4>Proof artifacts <span class="status failed">Incomplete</span></h4>
      <p class="status failed wrap-anywhere">Incomplete: ${escapeHtml(proof.error || 'proof bundle not published')}</p>
    </section>`;
  }

  function localCleanupBlock(run) {
    const cleanup = run.cleanup || {};
    const repairCleanup = (run.repair && run.repair.cleanup) || {};
    const cleanupRow = (label, value) => `<div><span class="tiny muted">${escapeHtml(label)}</span><br><strong>${value === true ? 'true' : value === false ? 'false' : 'missing'}</strong></div>`;
    return `<section id="localCleanup" class="card pad section" aria-label="Cleanup facts">
        <h4>Cleanup</h4>
        <div class="local-summary-grid">
          ${cleanupRow('repositoryRemoved', cleanup.repositoryRemoved)}
          ${cleanupRow('sandboxRemoved', cleanup.sandboxRemoved)}
          ${cleanupRow('candidateRemoved', repairCleanup.candidateRemoved != null ? repairCleanup.candidateRemoved : cleanup.candidateRemoved)}
          ${cleanupRow('originalUnchanged', run.repair && run.repair.originalUnchanged != null ? run.repair.originalUnchanged : cleanup.originalUnchanged)}
        </div>
      </section>`;
  }

  function localFixtureActionBlock(run) {
    if (run.status !== 'Completed') return '';
    return `<section class="card pad section">
        <h4>Fixture browser journey</h4>
        <p class="evidence-note">One button-click integration fixture, not verification of the cloned application. Chrome starts on demand and closes after evidence capture.</p>
        <div class="actions"><button class="btn" type="button" data-action="run-fixture-browser" data-audit-id="${escapeHtml(run.id)}">Run fixture browser journey</button></div>

  async function startLocalRepositoryCheck(form) {
    const buttonEl = form.querySelector('#startLocalAudit');
    const resultEl = document.getElementById('localRepoResult');
    const url = (form.querySelector('#localRepoUrl') && form.querySelector('#localRepoUrl').value || '').trim();
    if (!url) {
      if (resultEl) resultEl.innerHTML = localErrorMarkup('Enter a public GitHub repository URL before starting a check.', 'Nothing was cloned and no model was called.');
      return;
    }
    buttonEl.disabled = true;
    buttonEl.setAttribute('aria-busy', 'true');
    buttonEl.textContent = 'Check running…';
    delete form.dataset.auditId;
    if (resultEl) resultEl.innerHTML = localProgressMarkup();
    announce('Local check running.');
    try {
      const response = await fetch('/api/local/audits', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      const accepted = await response.json();
      if (!response.ok) throw new Error(accepted.error || `HTTP ${response.status}`);
      form.dataset.auditId = accepted.id;
      const deadline = Date.now() + 150000;
      while (Date.now() < deadline) {
        const progress = await fetch(`/api/local/audits/${encodeURIComponent(accepted.id)}`);
        const run = await progress.json();
        if (!progress.ok) throw new Error(run.error || `HTTP ${progress.status}`);
        if (run.status === 'Running') {
          updateLocalProgress(run);
        } else {
          renderMasterAudit(run, resultEl);
          announce(run.status === 'Completed' ? 'Local check completed.' : `Local check ${run.status}.`);
        }
        if (run.status !== 'Running') return;
        await new Promise(resolve => setTimeout(resolve, 250));
      }
      throw new Error('Audit deadline exceeded; status and cleanup are unknown. Check API health.');
    } catch (error) {
      const message = String(error && error.message ? error.message : error);
      if (resultEl) resultEl.innerHTML = localErrorMarkup(message, 'The run did not reach a verdict. Nothing below is proven.');
      announce(`Local check failed: ${message}`);
    } finally {
      buttonEl.disabled = false;
      buttonEl.removeAttribute('aria-busy');
      buttonEl.textContent = 'Start local check';
    }
  }

  function deepAuditFixture() {

  function deepTargetLabel(repository) {
    const value = String(repository || '').trim();
    if (!value) return 'local target';
    if (value.toLowerCase() === deepAuditFixture()) return 'the built-in demo fixture';
    return value;
  }

  function deepLaneTone(engine) {
    if (!engine) return 'unknown';
    if (engine.state === 'incomplete') return 'failed';
    if (engine.status === 'pass') return 'verified';
    if (engine.status === 'fail') return 'failed';
    return 'unknown';
  }

  function deepLaneLabel(engine) {
    if (!engine) return 'Not reported';
    if (engine.state === 'incomplete') return 'Incomplete';
    if (engine.status === 'pass') return 'Pass';
    if (engine.status === 'fail') return 'Fail';
    return 'Unknown';
  }

  function deepLaneRows(engines) {
    if (!Array.isArray(engines) || !engines.length) return '<li class="lane-empty">No lane has reported yet.</li>';
    return engines.map(engine => {
      const reason = engine.reason || (Array.isArray(engine.observations) && engine.observations.length ? engine.observations.join('; ') : '') || 'No reason reported';
      return `<li class="lane-row">
        <span class="lane-name">${escapeHtml(engine.name)}</span>
        <span><span class="status ${deepLaneTone(engine)}">${escapeHtml(deepLaneLabel(engine))}</span></span>
        <span class="lane-reason wrap-anywhere">${escapeHtml(reason)}</span>
      </li>`;
    }).join('');
  }

  function deepFindingTone(state_) {
    return { Confirmed: 'failed', Unconfirmed: 'warning', Unknown: 'unknown', Incomplete: 'unknown' }[state_] || 'unknown';
  }

  function deepFindingBlock(findings) {
    if (!Array.isArray(findings) || !findings.length) {
      return `<section class="card pad section evidence-card"><h4>Findings</h4><p class="evidence-note">No finding was raised by the lanes that completed.</p></section>`;
    }
    return `<section class="card pad section evidence-card"><h4>Findings (${findings.length})</h4>
      <ul class="finding-list">${findings.map(finding => `<li class="finding">
        <div class="finding-head">
          <span class="status ${deepFindingTone(finding.state)}">${escapeHtml(finding.state || 'Unknown')}</span>
          <span class="tiny muted">${escapeHtml(finding.category || 'Uncategorised')}</span>
          <span class="tiny muted">${escapeHtml(finding.impact || 'Unknown impact')}</span>
          <code class="tiny muted wrap-anywhere">${escapeHtml(finding.id || '')}</code>
        </div>
        <p class="finding-summary">${escapeHtml(finding.summary || 'No summary reported')}</p>
        ${finding.rootCause ? `<p class="evidence-note">${escapeHtml(finding.rootCause)}</p>` : ''}
      </li>`).join('')}</ul>
    </section>`;
  }

  function deepCoverageBlock(coverage) {
    const data = coverage || {};
    return `<section class="card pad section evidence-card"><h4>Coverage</h4>
      ${factGrid([
        fact('lanes', data.total != null ? data.total : 'Missing'),
        fact('completed', data.tested != null ? data.tested : 'Missing'),
        fact('incomplete', data.incomplete != null ? data.incomplete : 'Missing'),
        fact('unknown', data.unknown != null ? data.unknown : 'Missing'),

  function deepBudgetBlock(guardrails) {

      const payload = await response.json();
      if (!payload || !payload.run) return;

  async function startDeepAudit(form) {
    const button = form.querySelector('#startDeepAudit');
    const host = document.getElementById('deepAuditResult');
    const input = form.querySelector('#deepAuditRepository');
    const repository = ((input && input.value) || '').trim() || deepAuditFixture();
    const runId = `deep-${Date.now()}-${Math.random().toString(16).slice(2, 10)}`;
    button.disabled = true;
    button.setAttribute('aria-busy', 'true');
    button.textContent = 'Running lanes…';
    if (host) host.innerHTML = deepProgressMarkup(repository, runId);
    announce('Deep audit running.');
    const poll = setInterval(() => { refreshDeepRun(runId); }, 800);
    try {
      const response = await fetch('/api/demo/deep-audit', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ runId, repository }),
      });
      const payload = await response.json();
      if (!response.ok) throw new Error((payload && payload.error) || `HTTP ${response.status}`);
        renderDeepAuditRun(payload.run, host);
      announce('Deep audit finished.');
    } catch (error) {
      const message = String(error && error.message ? error.message : error);
      if (host) host.innerHTML = deepErrorMarkup(message, 'No lane result is proven for this run.');
      announce(`Deep audit failed: ${message}`);
    } finally {
      clearInterval(poll);
      button.disabled = false;
      button.removeAttribute('aria-busy');
      button.textContent = 'Run deep audit';
    }
  }

      const latest = await fetch(`/api/local/audits/${encodeURIComponent(auditId)}`);
