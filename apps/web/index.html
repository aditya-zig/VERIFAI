  let repairHuman = { auditId: '', token: '', approvalId: '', expiresAt: '' };

  function clearRepairHuman() {
    repairHuman = { auditId: '', token: '', approvalId: '', expiresAt: '' };
  }

  function repairApprovalError(status) {
    if (status === 401) return 'The server rejected the token (401).';
    if (status === 403) return 'The server refused this token (403). A human token is required for the approval.';
    if (status === 409) return 'The server refused the request (409). The repair is not in a state that can be approved.';
    if (status === 429) return 'The server is busy (429).';
    if (status === 503) return 'The service is unavailable (503).';
    return status ? `The server refused this request (HTTP ${status}).` : 'The request did not reach the server.';
  }

  async function approveLocalRepair(auditId, button) {
    const tokenInput = document.getElementById('localApprovalToken');
    const reviewed = document.getElementById('localApprovalReviewed');
    const state = document.getElementById('localApprovalState');
    const token = tokenInput && typeof tokenInput.value === 'string' ? tokenInput.value.trim() : '';
    if (!token) {
      if (state) state.innerHTML = '<p class="status failed">A human token is required before the repair can be approved.</p>';
      return;
    }
    if (!reviewed || reviewed.checked !== true) {
      if (state) state.innerHTML = '<p class="status failed">Confirm that you reviewed the immutable proof and the patch.</p>';
      return;
    }
    button.disabled = true;
    button.textContent = 'Approving…';
    try {
      const response = await fetch(`/api/local/audits/${encodeURIComponent(auditId)}/approval`, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'authorization': `Bearer ${token}` },
        body: '{}',
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        clearRepairHuman();
        if (state) state.innerHTML = `<p class="status failed">${escapeHtml(repairApprovalError(response.status))}</p>`;
        return;
      }
      repairHuman = { auditId, token, approvalId: body.approvalId ? String(body.approvalId) : '', expiresAt: body.expiresAt ? String(body.expiresAt) : '' };
      const publish = document.getElementById('localCreatePr');
      if (publish) publish.disabled = false;
      if (state) state.innerHTML = '<p class="status verified">Approved</p><p class="evidence-note">The publish action is unlocked. The approval is single use: a stale approval is rejected and the repair has to be approved again.</p>';
      announce('Repair approved.');
    } catch (error) {
      clearRepairHuman();
      if (state) state.innerHTML = `<p class="status failed">${escapeHtml(repairApprovalError(0))} ${escapeHtml(String(error && error.message ? error.message : error))}</p>`;
    } finally {
      button.disabled = false;
      button.textContent = 'Approve repair';
    }
  }

  async function createLocalPullRequest(auditId, buttonEl) {
    const host = document.getElementById('localPrResult');
    const approval = repairHuman;
    if (!approval.approvalId || approval.auditId !== auditId) {
      if (host) host.innerHTML = '<p class="status failed">The repair is not approved. Approve the repair first, then open the pull request.</p>';
      return;
    }
    buttonEl.disabled = true;
    buttonEl.textContent = 'Creating PR…';
    try {
      const response = await fetch(`/api/local/audits/${encodeURIComponent(auditId)}/pr`, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'authorization': `Bearer ${approval.token}` },
        body: JSON.stringify({ approvalId: approval.approvalId }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) {
        clearRepairHuman();
        if (host) host.innerHTML = `<p class="status failed">${escapeHtml(repairApprovalError(response.status))}</p>`;
        buttonEl.disabled = false;
        buttonEl.textContent = 'Create PR';
        return;
      }
      const url = result.pullRequest && result.pullRequest.url;
      if (host) host.innerHTML = url
        ? `<p class="status verified">PR created</p><a href="${escapeHtml(url)}" target="_blank" rel="noopener">Open pull request</a>`
        : '<p class="status verified">PR created</p>';
      clearRepairHuman();
      announce('Pull request created.');
    } catch (error) {
      clearRepairHuman();
      if (host) host.innerHTML = `<p class="status failed">Incomplete: ${escapeHtml(String(error && error.message ? error.message : error))}</p>`;
      buttonEl.disabled = false;
      buttonEl.textContent = 'Create PR';
    }
  }

  /* ---------- pull request verification screen ---------- */

  function renderPrVerificationScreen() {
    return `${appHeader()}
      <div class="page">
        <div class="page-head">
          <h1 id="prVerificationTitle" tabindex="-1">Pull request verification</h1>
          <p class="lede">Verify one pull request against the base and head it records, then read what the job actually ran.</p>
        </div>
        <form id="prVerificationForm" class="card pad form" aria-describedby="prVerificationHelp" novalidate>
          <div class="field-row">
            <div class="field">
              <label class="label" for="prRepository">Repository</label>
              <input id="prRepository" name="repository" class="input" type="text" autocomplete="off" spellcheck="false" placeholder="owner/repository" required aria-describedby="prRepositoryHelp" />
              <p id="prRepositoryHelp" class="help">owner/repository</p>
            </div>
            <div class="field">
              <label class="label" for="prPullRequest">Pull request number</label>
              <input id="prPullRequest" name="pullRequest" class="input" type="text" inputmode="numeric" autocomplete="off" placeholder="1" required aria-describedby="prPullRequestHelp" />
              <p id="prPullRequestHelp" class="help">A positive whole number.</p>
            </div>
          </div>
          <div class="field">
            <label class="label" for="prHeadSha">Expected head commit</label>
            <input id="prHeadSha" name="expectedHeadSha" class="input mono" type="text" autocomplete="off" spellcheck="false" placeholder="40 hexadecimal characters" required aria-describedby="prHeadShaHelp" />
            <p id="prHeadShaHelp" class="help">Exactly 40 hexadecimal characters.</p>
          </div>
          <div class="field">
            <label class="label" for="prToken">Bearer token</label>
            <input id="prToken" name="token" class="input" type="password" autocomplete="off" required aria-describedby="prTokenHelp" />
            <p id="prTokenHelp" class="help">Sent as an Authorization header. Kept in memory for this session only.</p>
          </div>
          <p class="form-limits">It verifies a pull request. It creates none and merges nothing.</p>
          <div class="actions">
            <button id="startPrVerification" class="btn primary" type="submit">Verify pull request</button>
            <span class="form-note">One job per start.</span>
          </div>
        </form>
        <div id="prVerificationResult" class="result-host section" role="region" aria-label="Verification job">
          <div class="empty-state">
            <p class="empty-title">No verification job yet</p>
            <p class="empty-note">Start one to see the phase, the exact base and head the job tested, the checks it covered, the cleanup and the verdict. Nothing is shown that the job did not record.</p>
          </div>
        </div>
        <div class="scope-grid">
          <section class="card pad scope">
            <h2>This job records</h2>
            <ul class="scope-list">
              <li>The phase the job reached, from Queued to Finished</li>
              <li>The exact base and head commits the checks ran against</li>
              <li>The checks that ran, and the ones that did not</li>
              <li>The cleanup facts and the limitations it hit</li>
              <li>One verdict, with the failure reason when there is one</li>
            </ul>
          </section>
          <section class="card pad scope">
            <h2>This screen does not</h2>
            <ul class="scope-list neg">
              <li>Create a pull request or merge one</li>
              <li>Report a check the job did not run</li>
              <li>Accept live AWS analysis: the controller reports it as not accepted</li>
              <li>Keep the token anywhere but this session's memory</li>
            </ul>
          </section>
        </div>
      </div>`;
  }

  const PR_ACTIVE_PHASES = ['Queued', 'Resolving', 'Planning', 'Executing', 'Cleaning'];
  const PR_FINISHED_PHASE = 'Finished';
  let prToken = '';
  let prJobId = '';
  let prJob = null;
  let prCapabilities = null;
  let prPollTimer = null;
  let prIdempotency = null;

  function prFieldValue(id) {
    const element = document.getElementById(id);
    return element && typeof element.value === 'string' ? element.value.trim() : '';
  }

  function prIdempotencyKey() {
    let random = '';
    try {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') random = crypto.randomUUID();
      else if (typeof crypto !== 'undefined' && typeof crypto.getRandomValues === 'function') {
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        random = Array.from(bytes, byte => byte.toString(16)).join('');
      }
    } catch (error) {
      random = '';
    }
    if (!random) random = Math.random().toString(36).slice(2) + Date.now().toString(36);
    return `prv-${random}`.replace(/[^A-Za-z0-9._-]/g, '').slice(0, 128);
  }

  function prValidate() {
    const repository = prFieldValue('prRepository');
    const pullRequest = prFieldValue('prPullRequest');
    const expectedHeadSha = prFieldValue('prHeadSha');
    const token = prFieldValue('prToken');
    const errors = [];
    if (!/^[^/\s]+\/[^/\s]+$/.test(repository)) errors.push({ field: 'prRepository', message: 'Enter the repository as owner/repository.' });
    if (!/^[1-9][0-9]*$/.test(pullRequest)) errors.push({ field: 'prPullRequest', message: 'Enter the pull request number as a positive whole number.' });
    if (!/^[0-9a-fA-F]{40}$/.test(expectedHeadSha)) errors.push({ field: 'prHeadSha', message: 'Enter the expected head commit as exactly 40 hexadecimal characters.' });
    if (!token) errors.push({ field: 'prToken', message: 'Enter the bearer token for this job.' });
    return { errors, payload: { repository, pullRequest: Number(pullRequest), expectedHeadSha } };
  }

  function prPhase(job) {
    const phase = job && (job.phase || job.status);
    return phase ? String(phase) : 'Not reported';
  }

  function prJobIsActive(job) {
    return PR_ACTIVE_PHASES.includes(prPhase(job));
  }

  function prVerdictTone(verdict) {
    const value = String(verdict || '').toLowerCase();
    if (value === 'verified') return 'verified';
    if (value === 'incomplete' || value === 'failed') return 'failed';
    return 'unknown';
  }

  function prText(value) {
    if (value === undefined || value === null || value === '') return 'Not reported';
    if (Array.isArray(value)) return value.length ? value.map(item => (typeof item === 'object' ? JSON.stringify(item) : String(item))).join(', ') : 'None reported';
    if (typeof value === 'object') return JSON.stringify(value);
    return String(value);
  }

  function prVerdictOf(job) {
    if (job && job.verdict !== undefined && job.verdict !== null) return job.verdict;
    if (job && job.result && job.result.verdict !== undefined && job.result.verdict !== null) return job.result.verdict;
    return undefined;
  }

  function prObservations(job) {
    const result = job && job.result;
    return result && Array.isArray(result.observations) ? result.observations : [];
  }

  // The commit a revision was actually run against. An expected head is never
  // reported as tested: only an observation that ran counts.
  function prTestedCommit(job, revision) {
    const observations = prObservations(job);
    const rows = observations.filter(row => row && row.revision === revision && row.executed === true);
    if (!rows.length) return 'Not tested';
    const shas = [...new Set(rows.map(row => row.commitSha).filter(Boolean))];
    return shas.length ? shas.join(', ') : 'Not reported';
  }

  function prObservationRows(job) {
    const observations = prObservations(job);
    if (!observations.length) return '<p class="evidence-note">No observation was recorded.</p>';
    return `<ul class="observation-list">${observations.map(row => {
      const artifactRefs = Array.isArray(row.artifactRefs) ? row.artifactRefs : [];
      const missing = row.executed !== true || !artifactRefs.length;
      return `<li class="observation">
        <div class="observation-head">
          <span class="observation-check mono">${escapeHtml(row.checkId || 'Not reported')}</span>
          <span class="status ${prVerdictTone(row.status)}">${escapeHtml(row.status || 'Not reported')}</span>
        </div>
        <p class="evidence-note">revision: ${escapeHtml(row.revision || 'Not reported')} · commit <code class="wrap-anywhere">${escapeHtml(row.commitSha || 'Not reported')}</code></p>
        <p class="evidence-note">executed: ${row.executed === true ? 'yes' : 'no'} · exit code: ${row.exitCode === null || row.exitCode === undefined ? 'Not reported' : escapeHtml(String(row.exitCode))}</p>
        <p class="evidence-note">artifacts: ${artifactRefs.length ? escapeHtml(artifactRefs.join(', ')) : 'None recorded'}</p>
        <p class="evidence-note mono wrap-anywhere">command digest ${escapeHtml(row.commandDigest || 'Not reported')} · test content ${escapeHtml(row.testContentSha256 || 'Not reported')}</p>
        ${missing ? '<p class="evidence-note">No evidence was recorded for this check.</p>' : ''}
      </li>`;
    }).join('')}</ul>`;
  }

  function prPlanChecks(title, checks) {
    const list = Array.isArray(checks) ? checks : [];
    if (!list.length) return `<p class="evidence-sub">${escapeHtml(title)}</p><p class="evidence-note">None planned</p>`;
    return `<p class="evidence-sub">${escapeHtml(title)} (${list.length})</p>
      <ul class="artifact-list">${list.map(check => `<li>
        <span class="artifact-name mono">${escapeHtml(check.checkId || 'Not reported')}</span>
        <span class="evidence-note">${escapeHtml(check.origin || 'Not reported')} · artifact ${escapeHtml(check.artifactRef || 'Not reported')} · content ${escapeHtml(check.contentSha256 || 'Not reported')}</span>
      </li>`).join('')}</ul>`;
  }

  function prLimitationsBlock(job) {
    const jobLimitations = Array.isArray(job && job.limitations) ? job.limitations : [];
    const resultLimitations = job && job.result && Array.isArray(job.result.limitations) ? job.result.limitations : [];
    const rows = (items, label) => (items.length
      ? `<p class="evidence-sub">${escapeHtml(label)} (${items.length})</p><ul class="artifact-list">${items.map(item => `<li><span class="artifact-name">${escapeHtml(String(item))}</span></li>`).join('')}</ul>`
      : `<p class="evidence-sub">${escapeHtml(label)}</p><p class="evidence-note">None reported</p>`);
    return `<section class="card pad section evidence-card"><h4>Limitations</h4>
      ${rows(jobLimitations, 'Job limitations')}
      ${rows(resultLimitations, 'Result limitations')}
    </section>`;
  }

  function prCandidateBlock(job) {
    const candidate = job && job.candidate ? job.candidate : (job && job.result ? job.result.candidate : null);
    if (!candidate) return `<section class="card pad section evidence-card"><h4>Candidate revision</h4><p class="evidence-note">Not reported</p></section>`;
    const changedFiles = Array.isArray(candidate.changedFiles) ? candidate.changedFiles : [];
    return `<section class="card pad section evidence-card"><h4>Candidate revision</h4>
      ${factGrid([
        fact('repository', candidate.repository),
        fact('pull request', candidate.pullRequest),
        fact('head repository', candidate.headRepository),
        fact('resolved base', candidate.baseSha, undefined, true),
        fact('resolved head', candidate.headSha, undefined, true),
        fact('merge base', candidate.mergeBaseSha, undefined, true),
        fact('diff digest', candidate.diffDigest, undefined, true),
      ])}
      <p class="evidence-sub">Changed files (${changedFiles.length})</p>
      ${changedFiles.length ? `<ul class="artifact-list">${changedFiles.map(file => `<li><span class="artifact-name mono">${escapeHtml(String(file))}</span></li>`).join('')}</ul>` : '<p class="evidence-note">None reported</p>'}
    </section>`;
  }

  function prPlanBlock(job) {
    const plan = job && job.plan ? job.plan : (job && job.result ? job.result.plan : null);
    if (!plan) return `<section class="card pad section evidence-card"><h4>Check plan</h4><p class="evidence-note">Not reported</p></section>`;
    return `<section class="card pad section evidence-card"><h4>Check plan</h4>
      ${factGrid([
        fact('policy version', plan.policyVersion),
        fact('profile', plan.profileId),
        fact('profile digest', plan.profileDigest, undefined, true),
        fact('plan digest', plan.planDigest, undefined, true),
      ])}
      ${prPlanChecks('Required checks', plan.requiredChecks)}
      ${prPlanChecks('Generated tests', plan.generatedTests)}
    </section>`;
  }

  function prCleanupBlock(job) {
    const result = job && job.result;
    if (!result) return `<section class="card pad section evidence-card"><h4>Cleanup</h4><p class="evidence-note">Not reported</p></section>`;
    return `<section class="card pad section evidence-card"><h4>Cleanup and evidence</h4>
      ${factGrid([
        fact('cleanup complete', result.cleanupComplete === true ? 'yes' : result.cleanupComplete === false ? 'no' : 'Not reported'),
        fact('superseded', result.superseded === true ? 'yes' : result.superseded === false ? 'no' : 'Not reported'),
        fact('evidence manifest', result.evidenceManifestSha256, undefined, true),
      ])}
    </section>`;
  }

  function renderPrJob(job, host) {
    prJob = job;
    const phase = prPhase(job);
    const verdict = prVerdictOf(job);
    const failure = job && job.failure ? job.failure : null;
    const request = job && job.request ? job.request : null;
    const tone = prJobIsActive(job) ? 'running' : phase === PR_FINISHED_PHASE ? 'unknown' : 'failed';
    host.innerHTML = `<section class="card pad result-root" data-job-id="${escapeHtml((job && job.id) || '')}">
      <div class="result-head">
        <div class="result-head-text">
          <h2 class="result-title">Pull request verification</h2>
          <p class="result-lede">${escapeHtml(prJobHeadline(job, phase, verdict, failure))}</p>
        </div>
        <p class="status ${tone}" id="prVerificationPhase">${escapeHtml(phase)}</p>
      </div>
      <section class="card pad section evidence-card" id="prVerificationFacts">
        <h4>Job</h4>
        ${factGrid([
          fact('job id', (job && job.id) || '', undefined, true),
          fact('phase', phase),
          fact('verdict', prText(verdict)),
        ])}
        ${request ? factGrid([
          fact('repository', request.repository),
          fact('pull request', request.pullRequest),
          fact('expected head', request.expectedHeadSha, undefined, true),
        ]) : ''}
        ${prFailureBlock(failure)}
      </section>
      ${prCandidateBlock(job)}
      ${prPlanBlock(job)}
      <section class="card pad section evidence-card" id="prVerificationObservations">
        <h4>Observations</h4>
        ${factGrid([
          fact('tested base commit', prTestedCommit(job, 'base'), undefined, true),
          fact('tested head commit', prTestedCommit(job, 'head'), undefined, true),
        ])}
        ${prObservationRows(job)}
      </section>
      ${prCleanupBlock(job)}
      ${prLimitationsBlock(job)}
      <p class="tiny muted">These are the fields the controller recorded. The resolved base and head are the candidate the controller resolved. A tested commit is one an observation actually ran: neither the request nor the candidate identity proves that a check ran.</p>
      <div class="actions">
        <button class="btn sm" type="button" data-action="cancel-pr-job" data-job-id="${escapeHtml((job && job.id) || '')}"${prJobIsActive(job) ? '' : ' disabled'}>Cancel job</button>
        <button class="btn sm" type="button" data-action="load-pr-evidence" data-job-id="${escapeHtml((job && job.id) || '')}">Load evidence</button>
      </div>
      <div id="prVerificationEvidence" role="status" aria-live="polite"></div>
    </section>${prCapabilities ? prCapabilitiesBlock(prCapabilities) : ''}`;
  }

  function prJobHeadline(job, phase, verdict, failure) {
    if (prJobIsActive(job)) return `The job is ${phase}. It is still running.`;
    if (failure && (failure.code || failure.message)) return `The job ${phase} with a failure. The code and the message are below.`;
    if (verdict !== undefined && verdict !== null && verdict !== '') return `The job ${phase}. Verdict: ${String(verdict)}.`;
    return `The job ${phase}. It recorded no verdict.`;
  }

  function prFailureBlock(failure) {
    if (!failure) return '';
    const code = failure.code ? String(failure.code) : 'Not reported';
    const message = failure.message ? String(failure.message) : 'Not reported';
    return `<div class="failure-block">
      <p class="evidence-sub">Failure</p>
      <p class="evidence-note mono wrap-anywhere">${escapeHtml(code)}</p>
      <p class="evidence-note wrap-anywhere">${escapeHtml(message)}</p>
    </div>`;
  }

  function prCapabilitiesBlock(capabilities) {
    const data = capabilities || {};
    return `<section class="card pad section evidence-card" id="prVerificationCapabilities">
      <h4>Controller runtime</h4>
      ${factGrid([
        fact('execution configured', data.executionConfigured === true ? 'yes' : data.executionConfigured === false ? 'no' : 'Not reported'),
        fact('publication configured', data.publicationConfigured === true ? 'yes' : data.publicationConfigured === false ? 'no' : 'Not reported'),
        fact('live AWS accepted', data.liveAwsAccepted === true ? 'yes' : data.liveAwsAccepted === false ? 'no' : 'Not reported'),
      ])}
    </section>`;
  }

  function prErrorBlock(status, body, host) {
    const reasons = {
      401: 'The server rejected the token (401).',
      403: 'The server refused this request (403). The token may not cover this job.',
      429: 'The server is busy (429).',
      503: 'The verification service is unavailable (503).',
    };
    const reason = reasons[status] || (status ? `The server refused this request (HTTP ${status}).` : 'The request did not reach the server.');
    const detail = body && (body.error || body.message) ? String(body.error || body.message) : '';
    host.innerHTML = `<section class="card pad error-block" role="alert" tabindex="-1" id="prVerificationError">
      <p class="error-title">The verification did not start</p>
      <p class="error-text">${escapeHtml(reason)}</p>
      ${detail ? `<p class="evidence-note wrap-anywhere">${escapeHtml(detail)}</p>` : ''}
      <p class="evidence-note">Your input is still in the form. Fix what the server named and start the job again.</p>
    </section>`;
    const error = document.getElementById('prVerificationError');
    if (error && typeof error.focus === 'function') error.focus();
  }

  function prValidationErrorBlock(errors, host) {
    host.innerHTML = `<section class="card pad error-block" role="alert" tabindex="-1" id="prVerificationError">
      <p class="error-title">The form needs a fix</p>
      <ul class="artifact-list">${errors.map(item => `<li><span class="artifact-name">${escapeHtml(item.message)}</span></li>`).join('')}</ul>
    </section>`;
    const error = document.getElementById('prVerificationError');
    if (error && typeof error.focus === 'function') error.focus();
    const first = document.getElementById(errors[0].field);
    if (first && typeof first.focus === 'function') first.focus();
  }

  async function startPrVerification(form) {
    const button = document.getElementById('startPrVerification');
    const host = document.getElementById('prVerificationResult');
    const { errors, payload } = prValidate();
    if (errors.length) {
      prValidationErrorBlock(errors, host);
      return;
    }
    prToken = prFieldValue('prToken');
    const signature = JSON.stringify(payload);
    if (!prIdempotency || prIdempotency.signature !== signature) prIdempotency = { signature, key: prIdempotencyKey() };
    button.disabled = true;
    button.setAttribute('aria-busy', 'true');
    button.textContent = 'Starting job…';
    host.innerHTML = '<section class="card pad result-root"><p class="busy-row"><span class="spinner-inline" aria-hidden="true"></span>Starting the verification job…</p></section>';
    try {
      const response = await fetch('/api/local/pr-verifications', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'authorization': `Bearer ${prToken}`, 'idempotency-key': prIdempotency.key },
        body: JSON.stringify(payload),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        prErrorBlock(response.status, body, host);
        return;
      }
      const job = (body && body.job) || {};
      prJobId = job.id ? String(job.id) : '';
      prCapabilities = null;
      renderPrJob(job, host);
      startPrPolling();
      loadPrCapabilities(host);
    } catch (error) {
      prErrorBlock(0, { error: String(error && error.message ? error.message : error) }, host);
    } finally {
      button.disabled = false;
      button.removeAttribute('aria-busy');
      button.textContent = 'Verify pull request';
    }
  }

  function stopPrPolling() {
    if (prPollTimer) {
      clearInterval(prPollTimer);
      prPollTimer = null;
    }
  }

  function startPrPolling() {
    stopPrPolling();
    if (!prJobId) return;
    prPollTimer = setInterval(async () => {
      if (!prJobId) {
        stopPrPolling();
        return;
      }
      const host = document.getElementById('prVerificationResult');
      try {
        const response = await fetch(`/api/local/pr-verifications/${encodeURIComponent(prJobId)}`, {
          headers: { 'authorization': `Bearer ${prToken}` },
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          if (host) prErrorBlock(response.status, body, host);
          stopPrPolling();
          return;
        }
        const job = (body && body.job) || body || {};
        if (host) renderPrJob(job, host);
        if (!prJobIsActive(job)) {
          stopPrPolling();
          prIdempotency = null;
        }
      } catch (error) {
        if (host) prErrorBlock(0, { error: String(error && error.message ? error.message : error) }, host);
        stopPrPolling();
      }
    }, 1500);
  }

  async function loadPrCapabilities(host) {
    if (!host) return;
    try {
      const response = await fetch('/api/local/pr-verifications/capabilities', {
        headers: { 'authorization': `Bearer ${prToken}` },
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) return;
      prCapabilities = body;
      if (prJob) renderPrJob(prJob, host);
    } catch (error) {
      // the runtime card is an extra, the job result stays the source of truth
    }
  }

  async function cancelPrJob(button) {
    if (!prJobId) return;
    const host = document.getElementById('prVerificationResult');
    button.disabled = true;
    try {
      const response = await fetch(`/api/local/pr-verifications/${encodeURIComponent(prJobId)}/cancel`, {
        method: 'POST',
        headers: { 'authorization': `Bearer ${prToken}` },
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (host) prErrorBlock(response.status, body, host);
        button.disabled = false;
        return;
      }
      stopPrPolling();
      if (host) renderPrJob((body && body.job) || {}, host);
    } catch (error) {
      if (host) prErrorBlock(0, { error: String(error && error.message ? error.message : error) }, host);
      button.disabled = false;
    }
  }

  async function loadPrEvidence(button) {
    if (!prJobId) return;
    const host = document.getElementById('prVerificationEvidence');
    button.disabled = true;
    if (host) host.innerHTML = '<p class="busy-row"><span class="spinner-inline" aria-hidden="true"></span>Loading evidence…</p>';
    try {
      const response = await fetch(`/api/local/pr-verifications/${encodeURIComponent(prJobId)}/evidence`, {
        headers: { 'authorization': `Bearer ${prToken}` },
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (host) host.innerHTML = `<p class="status failed">Incomplete: ${escapeHtml(String((body && body.error) || `HTTP ${response.status}`))}</p>`;
        return;
      }
      const evidence = body || {};
      const status = evidence.status ? String(evidence.status) : 'Not reported';
      const verdict = evidence.verdict !== undefined && evidence.verdict !== null ? evidence.verdict : undefined;
      const limitations = Array.isArray(evidence.limitations) ? evidence.limitations : [];
      const parts = [];
      parts.push(`<div class="observation-head"><span class="evidence-sub">Evidence status</span><span class="status ${status === 'Available' ? 'verified' : status === 'Unavailable' ? 'failed' : 'unknown'}">${escapeHtml(status)}</span></div>`);
      if (status === 'Unavailable') parts.push('<p class="evidence-note">The job finished without a recorded result, so there is no evidence bundle to read.</p>');
      if (status === 'Pending') parts.push('<p class="evidence-note">The job has not produced a result yet.</p>');
      if (verdict !== undefined) parts.push(`<p class="evidence-note">Verdict: ${escapeHtml(prText(verdict))}</p>`);
      if (limitations.length) parts.push(`<p class="evidence-sub">Limitations (${limitations.length})</p><ul class="artifact-list">${limitations.map(item => `<li><span class="artifact-name">${escapeHtml(String(item))}</span></li>`).join('')}</ul>`);
      if (evidence.candidate) parts.push(`<p class="evidence-sub">Candidate</p>${factGrid([fact('candidate base', evidence.candidate.baseSha, undefined, true), fact('candidate head', evidence.candidate.headSha, undefined, true), fact('merge base', evidence.candidate.mergeBaseSha, undefined, true)])}`);
      if (evidence.plan) parts.push(`<p class="evidence-sub">Plan</p>${factGrid([fact('profile', evidence.plan.profileId), fact('plan digest', evidence.plan.planDigest, undefined, true)])}`);
      if (evidence.result) {
        const observations = Array.isArray(evidence.result.observations) ? evidence.result.observations : [];
        parts.push(`<p class="evidence-sub">Result</p>${factGrid([
          fact('verdict', prText(evidence.result.verdict)),
          fact('observations', observations.length),
          fact('cleanup complete', evidence.result.cleanupComplete === true ? 'yes' : evidence.result.cleanupComplete === false ? 'no' : 'Not reported'),
          fact('evidence manifest', evidence.result.evidenceManifestSha256, undefined, true),
        ])}`);
      }
      if (host) host.innerHTML = `<div class="evidence-card">${parts.join('') || '<p class="evidence-note">The evidence endpoint returned no fields.</p>'}</div>`;
    } catch (error) {
      if (host) host.innerHTML = `<p class="status failed">Incomplete: ${escapeHtml(String(error && error.message ? error.message : error))}</p>`;
    } finally {
      button.disabled = false;
    }
  }

  /* ---------- routing ---------- */

  function screenFromHash(hash) {
    const name = String(hash || '').replace(/^#\/?/, '').trim();
    return Object.prototype.hasOwnProperty.call(SCREENS, name) ? name : 'landing';
  }

  function navigate(screen, push = true) {
    if (!Object.prototype.hasOwnProperty.call(SCREENS, screen)) return;
    if (screen !== 'pr-verification') stopPrPolling();
    state.screen = screen;
    if (push && location.hash !== `#/${screen}`) location.hash = `#/${screen}`;
    render();
    const title = document.getElementById(`${screen === 'landing' ? 'localAuditTitle' : screen === 'deep-audit' ? 'deepAuditTitle' : 'prVerificationTitle'}`);
    if (title && typeof title.focus === 'function') title.focus();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  function render() {
    const screen = SCREENS[state.screen] || SCREENS.landing;
    app.innerHTML = screen.render();
    document.title = screen.docTitle;
    if (state.screen !== 'pr-verification') stopPrPolling();
  }

  document.addEventListener('submit', (event) => {
    const repositoryForm = event.target.closest('#localRepositoryForm');
    if (repositoryForm) {
      event.preventDefault();
      startLocalRepositoryCheck(repositoryForm);
      return;
    }
    const deepForm = event.target.closest('#deepAuditForm');
    if (deepForm) {
      event.preventDefault();
      startDeepAudit(deepForm);
      return;
    }
    const prForm = event.target.closest('#prVerificationForm');
    if (prForm) {
      event.preventDefault();
      startPrVerification(prForm);
    }
  });

  document.addEventListener('click', (event) => {
    const fixtureBrowser = event.target.closest('[data-action="run-fixture-browser"]');
    if (fixtureBrowser) { event.preventDefault(); runFixtureBrowser(fixtureBrowser); return; }
    const approveRepair = event.target.closest('[data-action="approve-local-repair"]');
    if (approveRepair) { event.preventDefault(); approveLocalRepair(approveRepair.dataset.auditId, approveRepair); return; }
    const createPr = event.target.closest('[data-action="create-local-pr"]');
    if (createPr) { event.preventDefault(); createLocalPullRequest(createPr.dataset.auditId, createPr); return; }
    const repairAudit = event.target.closest('[data-action="repair-local-audit"]');
    if (repairAudit) { event.preventDefault(); verifyLocalRepair(repairAudit.dataset.auditId, repairAudit); return; }
    const steer = event.target.closest('[data-action="steer-deep-audit"]');
    if (steer) { event.preventDefault(); steerDeepAudit(steer.dataset.runId, steer); return; }
    const cancelPr = event.target.closest('[data-action="cancel-pr-job"]');
    if (cancelPr) { event.preventDefault(); cancelPrJob(cancelPr); return; }
    const prEvidence = event.target.closest('[data-action="load-pr-evidence"]');
    if (prEvidence) { event.preventDefault(); loadPrEvidence(prEvidence); return; }
    const retryLocal = event.target.closest('[data-action="retry-local-audit"]');
    if (retryLocal) {
      event.preventDefault();
      const form = document.getElementById('localRepositoryForm');
      if (form) startLocalRepositoryCheck(form);
      return;
    }
    const retryDeep = event.target.closest('[data-action="retry-deep-audit"]');
    if (retryDeep) {
      event.preventDefault();
      const form = document.getElementById('deepAuditForm');
      if (form) startDeepAudit(form);
      return;
    }
    const nav = event.target.closest('[data-nav]');
    if (nav) {
      event.preventDefault();
      navigate(nav.dataset.nav);
    }
  });

  window.addEventListener('hashchange', () => {
    const next = screenFromHash(location.hash);
    if (next !== state.screen) {
      state.screen = next;
      render();
    }
  });

  window.VERIFAI = { navigate, render, state, screens: SCREENS };
  state.screen = screenFromHash(location.hash);
  render();
})();
  </script>

</body>
</html>
