name: VERIFAI CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Build bounded local audit sandbox
        run: docker build -t verifai-local-audit:m4 -f infra/local/audit.Dockerfile infra/local
      - name: Run real local E2E
        env:
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
        run: npm run test:local-e2e
      - if: always()
        run: npm run ops:test
