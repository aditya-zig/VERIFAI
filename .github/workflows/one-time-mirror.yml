name: One-time mirror from AWS-wemakedevs

on:
  push:
    paths:
      - ".github/workflows/one-time-mirror.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror source repository into VERIFAI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/aditya-zig/AWS-wemakedevs.git /tmp/source.git
          cd /tmp/source.git
          DEST="https://x-access-token:${GH_TOKEN}@github.com/aditya-zig/VERIFAI.git"
          git push --force --prune "$DEST" 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
