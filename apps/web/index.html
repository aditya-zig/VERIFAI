<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="Clone and inspect a public GitHub repository locally with VERIFAI." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2379AF96'/%3E%3C/svg%3E" />
  <title>VERIFAI — Local repository check</title>
  <style>
:root {
  --bg: #fffaf5;
  --surface: #ffffff;
  --surface-2: #f7f4ef;
  --surface-3: #eee8e1;
  --text: #2d2019;
  --muted: #6f625b;
  --muted-2: #9a8d85;
  --border: #e5ded7;
  --border-strong: #cfc4ba;
  --ink: #2d2019;
  --accent: #ff4f00;
  --accent-dark: #e54400;
  --accent-soft: #fff0e8;
  --verified: #16803f;
  --verified-soft: #ebf8f0;
  --failed: #c93b37;
  --failed-soft: #fff0ef;
  --running: #2468d5;
  --running-soft: #eef5ff;
  --warning: #a5680b;
  --warning-soft: #fff7e8;
  --unknown: #667085;
  --unknown-soft: #f2f4f7;
  --shadow-sm: 0 2px 0 rgba(45,32,25,.04), 0 4px 14px rgba(45,32,25,.05);
  --shadow-md: 0 22px 60px rgba(45,32,25,.12), 0 6px 20px rgba(45,32,25,.06);
  --shadow-hover: 0 24px 50px rgba(45,32,25,.14), 0 8px 18px rgba(45,32,25,.08);
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 18px;
  --max: 1240px;
  --sidebar: 232px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background:
    radial-gradient(circle at 12% 8%, rgba(255,79,0,.07), transparent 28%),
    linear-gradient(180deg, #fffdf9 0%, var(--bg) 46%, #fff 100%);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.5;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

.skip-link {
  position: fixed; left: 16px; top: -48px; z-index: 1000;
  padding: 10px 14px; border-radius: 8px; background: var(--ink); color: white;
}
.skip-link:focus { top: 16px; }
:focus-visible { outline: 3px solid rgba(37,99,235,.35); outline-offset: 2px; }

.app-header {
  height: 64px; display: flex; align-items: center; border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,.94); position: sticky; top: 0; z-index: 20; backdrop-filter: blur(10px);
}
.header-inner { width: min(var(--max), calc(100% - 40px)); margin: 0 auto; display: flex; align-items: center; gap: 24px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 760; letter-spacing: -.02em; }
.brand-mark { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 8px; display: inline-block; background: #79af96; box-shadow: inset 0 0 0 1px rgba(45,32,25,.04); transition: transform .18s cubic-bezier(.2,.8,.2,1), opacity .18s ease; }
.brand:hover .brand-mark { transform: scale(1.05); opacity: .92; }
.header-nav { display: flex; gap: 22px; margin-left: auto; align-items: center; color: var(--muted); font-size: 14px; }
.header-nav a,.header-nav button { position: relative; }
.header-nav button { border:0; background:transparent; color:inherit; padding:0; font:inherit; cursor:pointer; }
.header-nav a::after,.header-nav button::after { content: ''; position: absolute; left: 0; right: 100%; bottom: -7px; height: 2px; border-radius: 999px; background: var(--accent); transition: right .2s ease; }
.header-nav a:hover,.header-nav button:hover,.header-nav button.active { color: var(--text); }
.header-nav a:hover::after,.header-nav button:hover::after,.header-nav button.active::after { right: 0; }
.app-header.scrolled { border-bottom-color:#d9d1c8; box-shadow:0 8px 26px rgba(45,32,25,.055); }
.header-actions { display: flex; gap: 10px; align-items: center; }

.btn {
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  min-height: 42px; padding: 0 16px; border-radius: 9px; font-weight: 720; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: var(--shadow-sm); transition: border-color .18s ease, transform .18s cubic-bezier(.2,.8,.2,1), background .18s ease, box-shadow .18s ease;
}
.btn:hover { border-color: #b7a99d; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(45,32,25,.10); }
.btn:active { transform: translateY(0) scale(.985); }
.btn.primary { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 8px 18px rgba(255,79,0,.20); }
.btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); box-shadow: 0 12px 24px rgba(255,79,0,.28); }
.btn.primary::after { content: '→'; display: inline-block; transition: transform .18s ease; }
.btn.primary:hover::after { transform: translateX(3px); }
.btn.blue { background: var(--accent); color: white; border-color: var(--accent); }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--muted); }
.btn.danger { color: var(--failed); }
.btn.sm { min-height: 34px; padding: 0 11px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.page { width: min(var(--max), calc(100% - 40px)); margin: 0 auto; padding: 36px 0 64px; }
.page.narrow { max-width: 820px; }
.page.compact { padding-top: 24px; }
.eyebrow { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
h1,h2,h3,p { margin-top: 0; }
h1 { font-size: clamp(34px, 5vw, 62px); line-height: 1.02; letter-spacing: -.045em; margin-bottom: 18px; }
h2 { font-size: 28px; line-height: 1.15; letter-spacing: -.025em; margin-bottom: 10px; }
h3 { font-size: 17px; line-height: 1.25; letter-spacing: -.01em; margin-bottom: 8px; }
.lede { color: var(--muted); font-size: 18px; max-width: 720px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.section { margin-top: 28px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.hero { min-height: 690px; display: grid; grid-template-columns: .9fr 1.1fr; gap: 54px; align-items: center; padding: 64px 0 80px; }
.hero-copy { padding: 34px 0; }
.hero-copy .lede { max-width: 650px; }
.hero-actions { display: flex; gap: 10px; margin: 26px 0 14px; flex-wrap: wrap; }
.hero-note { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.hero-preview { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-md); overflow: hidden; transform: rotate(.3deg); }
.preview-bar { height: 42px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 7px; padding: 0 14px; background: #fbfcfd; }
.dot { width: 8px; height: 8px; border-radius: 999px; background: #d3d8df; }
.preview-body { padding: 22px; }
.preview-requirement { border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
.preview-chain { display: grid; gap: 8px; margin-top: 14px; }
.chain-row { display: grid; grid-template-columns: 130px 1fr auto; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
.chain-row:first-child { border-top: 0; }
.chain-label { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }

.cap-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); transition: transform .22s cubic-bezier(.2,.8,.2,1), border-color .22s ease, box-shadow .22s ease; }
.card.pad { padding: 18px; }
.card.pad-lg { padding: 24px; }
.card.flat { box-shadow: none; }
.card.hover:hover, .metric:hover, .result-row:hover, .plan-group:hover, .req-card:hover, .detect-item:hover { border-color: #c9bbb0; transform: translateY(-4px); box-shadow: var(--shadow-hover); }
.card.hover .icon-box { transition: transform .22s ease, background .22s ease, color .22s ease; }
.card.hover:hover .icon-box { transform: rotate(-4deg) scale(1.06); background: var(--accent-soft); color: var(--accent); }
.repo-row { transition: background .18s ease, transform .18s ease; }
.repo-row:hover { background: #fff8f2; transform: translateX(3px); }
.side-link, .tab, .engine { transition: background .18s ease, color .18s ease, transform .18s ease, border-color .18s ease; }
.side-link:hover { transform: translateX(2px); }
.tab:hover { color: var(--text); background: #fff7f1; }
.engine:hover { border-color: #c9bbb0; transform: translateY(-1px); }
.icon-box { width: 34px; height: 34px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; margin-bottom: 14px; }

.status { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 8px; font-size: 12px; line-height: 1; font-weight: 760; border: 1px solid transparent; white-space: nowrap; }
.status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.verified { color: var(--verified); background: var(--verified-soft); border-color: #caecd5; }
.status.failed { color: var(--failed); background: var(--failed-soft); border-color: #f2cecb; }
.status.running { color: var(--running); background: var(--running-soft); border-color: #cadcff; }
.status.warning { color: var(--warning); background: var(--warning-soft); border-color: #f0debb; }
.status.unknown { color: var(--unknown); background: var(--unknown-soft); border-color: #e2e5ea; }

/* Local result page: summary, section cards, machine evidence (adapted from PR #66 presentation) */
.result-root { display: grid; gap: 16px; min-width: 0; }
.result-summary { display: grid; gap: 12px; min-width: 0; justify-items: start; }
.result-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: baseline; gap: 5px; max-width: 100%; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); padding: 4px 10px; font-size: 12px; line-height: 1.35; color: var(--muted); }
.chip b { color: var(--text); font-weight: 720; overflow-wrap: anywhere; }
.chip.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; }

.evidence-card { display: grid; gap: 12px; min-width: 0; }
.evidence-card > .result-chips { justify-self: start; }
.evidence-card > h4 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.evidence-note { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
.evidence-sub { margin: 2px 0 0; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-2); }

.fact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 168px), 1fr)); gap: 8px; margin: 0; }
.stage-facts { list-style: none; padding: 0; }
.fact { min-width: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); padding: 8px 10px; }
.fact dt { margin: 0 0 3px; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-2); }
.fact dd { margin: 0; font-size: 13px; font-weight: 660; color: var(--text); overflow-wrap: anywhere; }
.fact dd.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
.fact.good { border-color: #caecd5; background: var(--verified-soft); }
.fact.bad { border-color: #f2cecb; background: var(--failed-soft); }
.fact.warn { border-color: #f0debb; background: var(--warning-soft); }
.fact.good dt, .fact.good dd { color: var(--verified); }
.fact.bad dt, .fact.bad dd { color: var(--failed); }
.fact.warn dt, .fact.warn dd { color: var(--warning); }

.artifact-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.artifact-list li { min-width: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); padding: 8px 10px; }
.artifact-list .artifact-name { font-weight: 700; font-size: 13px; color: var(--text); overflow-wrap: anywhere; }

@media(max-width:720px){
  .fact-grid { grid-template-columns: 1fr; }
}

/* Zapier-inspired interactive workflow canvas */
.flow-shell { position: relative; min-height: 525px; border: 1px solid #d9cec4; border-radius: 22px; background:
  linear-gradient(rgba(45,32,25,.045) 1px, transparent 1px),
  linear-gradient(90deg, rgba(45,32,25,.045) 1px, transparent 1px),
  #fff; background-size: 28px 28px; box-shadow: var(--shadow-md); overflow: hidden; isolation: isolate; }
.flow-shell::before { content:''; position:absolute; inset:-25% auto auto -18%; width:330px; height:330px; border-radius:50%; background:rgba(255,79,0,.08); filter:blur(8px); z-index:-1; }
.flow-topbar { position:absolute; inset:0 0 auto 0; height:52px; background:rgba(255,255,255,.92); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 16px; z-index:5; backdrop-filter:blur(10px); }
.flow-title { display:flex; align-items:center; gap:9px; font-size:12px; font-weight:800; letter-spacing:.02em; }
.flow-live { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; font-weight:700; }
.flow-live-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 0 rgba(255,79,0,.35); animation:livePulse 1.8s ease-out infinite; }
@keyframes livePulse { 0%{box-shadow:0 0 0 0 rgba(255,79,0,.35)} 70%{box-shadow:0 0 0 8px rgba(255,79,0,0)} 100%{box-shadow:0 0 0 0 rgba(255,79,0,0)} }
.flow-canvas { position:absolute; inset:52px 0 0 0; }
.flow-lines { position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
.flow-line { fill:none; stroke:#b9aca2; stroke-width:1.7; stroke-linecap:round; stroke-dasharray:5 9; animation:flowDash 1.25s linear infinite; }
.flow-line.hot { stroke:var(--accent); stroke-width:2; }
@keyframes flowDash { to { stroke-dashoffset:-28; } }
.flow-node { position:absolute; z-index:2; width:176px; min-height:74px; background:#fff; border:1px solid #d3c8bf; border-radius:12px; padding:12px 13px; box-shadow:0 8px 20px rgba(45,32,25,.07); transition: transform .24s cubic-bezier(.2,.8,.2,1), box-shadow .24s ease, border-color .24s ease; font:inherit; color:inherit; text-align:left; cursor:pointer; }
.flow-node:hover { transform:translateY(-5px) scale(1.015); border-color:#9e8f84; box-shadow:0 18px 34px rgba(45,32,25,.14); z-index:4; }
.flow-node::after { content:'Open ↗'; position:absolute; left:12px; bottom:-24px; opacity:0; color:var(--accent); font-size:10px; font-weight:800; transition:opacity .18s ease, transform .18s ease; transform:translateY(-3px); pointer-events:none; }
.flow-node:hover::after,.flow-node:focus-visible::after { opacity:1; transform:none; }
.flow-node.active { border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,79,0,.13), 0 16px 32px rgba(45,32,25,.12); animation:nodeBreathe 1.15s ease both; }
@keyframes nodeBreathe { 0%{transform:scale(.985)} 55%{transform:scale(1.025)} 100%{transform:scale(1)} }
.flow-node .node-kicker { display:block; color:var(--muted); font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
.flow-node .node-title { display:block; font-weight:800; font-size:13px; margin-top:3px; }
.flow-node .node-meta { display:block; color:var(--muted); font-size:11px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.flow-node .node-icon { position:absolute; right:10px; top:10px; width:23px; height:23px; border-radius:7px; display:grid; place-items:center; background:var(--surface-2); font-size:11px; font-weight:900; }
.flow-node.active .node-icon { background:var(--accent); color:#fff; }
.flow-node.repo { left:50%; top:24px; transform:translateX(-50%); }
.flow-node.repo:hover { transform:translateX(-50%) translateY(-5px) scale(1.015); }
.flow-node.repo.active { transform:translateX(-50%) scale(1.02); }
.flow-node.requirements { left:7%; top:142px; }
.flow-node.sandbox { right:7%; top:142px; }
.flow-node.experiment { left:50%; top:250px; transform:translateX(-50%); }
.flow-node.experiment:hover { transform:translateX(-50%) translateY(-5px) scale(1.015); }
.flow-node.experiment.active { transform:translateX(-50%) scale(1.02); }
.flow-node.failure { left:8%; top:365px; }
.flow-node.repair { right:8%; top:365px; }
.flow-mini-loader { width:14px; height:14px; border-radius:50%; border:2px solid #f1c7b4; border-top-color:var(--accent); animation:spin .8s linear infinite; }
.flow-caption { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); background:#2d2019; color:#fff; border-radius:999px; padding:7px 11px; font-size:11px; font-weight:750; box-shadow:0 8px 20px rgba(45,32,25,.16); z-index:5; min-width:210px; text-align:center; }
.flow-hint { position:absolute; right:14px; bottom:14px; color:var(--muted); font-size:10px; z-index:4; }
.route-enter { animation:routeIn .28s cubic-bezier(.2,.8,.2,1) both; }
@keyframes routeIn { from{opacity:.35; transform:translateY(5px)} to{opacity:1; transform:none} }
.metric,.result-row,.plan-group,.req-card,.detect-item { transition:transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease, border-color .22s ease; }
.progress-fill { background: linear-gradient(90deg, var(--accent), #ff8a4c); }
.auth-wrap { min-height: calc(100vh - 64px); display: grid; place-items: center; padding: 30px 20px; }
.auth-card { width: min(430px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: var(--shadow-md); }
.auth-card .brand { margin-bottom: 28px; }
.auth-buttons { display: grid; gap: 10px; margin: 22px 0; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted-2); font-size: 12px; margin: 18px 0; }
.divider::before,.divider::after { content: ''; height: 1px; flex: 1; background: var(--border); }

.workspace { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: calc(100vh - 64px); }
.sidebar { border-right: 1px solid var(--border); background: var(--surface); padding: 20px 14px; }
.side-title { padding: 0 10px 12px; color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.side-link { width: 100%; border: 0; background: transparent; color: var(--muted); text-align: left; padding: 9px 10px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.side-link:hover,.side-link.active { background: var(--surface-2); color: var(--text); }
.workspace-main { min-width: 0; }
.workspace .page { width: min(1040px, calc(100% - 48px)); }

.empty-state { min-height: 380px; display: grid; place-items: center; text-align: center; border: 1px dashed var(--border-strong); border-radius: 14px; background: linear-gradient(180deg,#fff,#fbfcfd); padding: 48px; }
.empty-state .icon-box { margin: 0 auto 16px; width: 46px; height: 46px; }

.stepper { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; margin: 18px 0 28px; }
.step { position: relative; padding-top: 12px; color: var(--muted); font-size: 12px; font-weight: 700; }
.step::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 999px; background: var(--surface-3); }
.step.active { color: var(--text); }
.step.done { color: var(--verified); }
.step.active::before { background: var(--accent); }
.step.done::before { background: var(--verified); }

.search { width: 100%; height: 44px; border: 1px solid var(--border-strong); border-radius: 9px; padding: 0 14px; background: white; color: var(--text); }
.repo-row { display: grid; grid-template-columns: 1fr auto; gap: 14px; padding: 18px 20px; border-top: 1px solid var(--border); align-items: center; }
.repo-row:first-child { border-top: 0; }
.repo-name { font-weight: 760; }
.repo-meta { display: flex; gap: 14px; color: var(--muted); font-size: 13px; margin-top: 5px; }

.detect-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; }
.detect-item { padding: 16px; border: 1px solid var(--border); border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.detect-label { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
.detect-value { font-weight: 700; }
.check { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--verified); background: var(--verified-soft); font-weight: 900; }

.form-grid { display: grid; gap: 18px; }
.form-row { display: grid; grid-template-columns: 180px 1fr; gap: 20px; align-items: start; padding: 18px 0; border-top: 1px solid var(--border); }
.form-row:first-child { border-top: 0; padding-top: 0; }
.label { font-weight: 720; }
.help { color: var(--muted); font-size: 13px; margin-top: 3px; }
.input,.textarea,.select { width: 100%; border: 1px solid var(--border-strong); background: white; border-radius: 9px; color: var(--text); }
.input,.select { height: 42px; padding: 0 12px; }
.textarea { min-height: 220px; resize: vertical; padding: 12px; }
.secret-list { overflow: hidden; border: 1px solid var(--border); border-radius: 10px; }
.secret-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); }
.secret-row:first-child { border-top: 0; }

.plan-group { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: white; margin-top: 14px; }

.experiment-list { counter-reset: experiment; padding: 8px 18px 14px; margin: 0; list-style: none; }

.experiment-list li::before { content: counter(experiment); width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--muted); }
.engine-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 18px 18px; }

.lab-req { padding: 11px; border-radius: 8px; display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 6px; color: var(--muted); }
.lab-req.active { background: var(--failed-soft); color: var(--text); }
.timeline { display: grid; }
.timeline-row { display: grid; grid-template-columns: 78px 18px 1fr; gap: 8px; align-items: start; padding: 9px 0; border-bottom: 1px solid var(--border); animation: rowIn .22s ease both; animation-delay: calc(var(--i) * 55ms); }
.timeline-row:last-child { border-bottom: 0; }
.time { font-family: ui-monospace,monospace; font-size: 12px; color: var(--muted); }
.event-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); margin-top: 7px; }
.event-dot.done { background: var(--verified); }
.event-dot.fail { background: var(--failed); }
.event-dot.warn { background: var(--warning); }

@keyframes rowIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.evidence-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.desktop { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 12px; background: #f8fafc; }
.desktop-top { height: 34px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 5px; padding: 0 10px; background: white; }

.checkout { width: min(320px,100%); background: white; border: 1px solid var(--border); border-radius: 10px; padding: 14px; box-shadow: var(--shadow-sm); }
.checkout-line { height: 9px; border-radius: 999px; background: var(--surface-3); margin: 8px 0; }

.spinner { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #dbe3ec; border-top-color: var(--failed); animation: spin 1s linear infinite; margin: 18px auto 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.engine-list { display: grid; gap: 8px; }

.summary-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin: 20px 0; }

.result-row.verified { border-left: 4px solid var(--verified); }
.result-row.unknown { border-left: 4px solid var(--unknown); }
.result-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }

#localRepoResult pre { overflow-x: auto; white-space: pre-wrap; }

.issue-header { display: flex; justify-content: space-between; gap: 18px; align-items: start; margin-bottom: 20px; }
.issue-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 13px; }

.code-block { background: #0e1420; color: #e7edf7; border-radius: 12px; padding: 18px; overflow: auto; font-size: 13px; line-height: 1.7; border: 1px solid #1a2332; }

.diff-neutral { color: #c8d1dc; display: block; }

.progress-list { display: grid; gap: 12px; }

.progress-top { display: flex; justify-content: space-between; gap: 16px; }

.verified-hero { text-align: center; padding: 48px 20px 32px; }

.before-after { display: grid; grid-template-columns: 1fr 36px 1fr; gap: 12px; align-items: stretch; margin: 24px 0; }

.project-head { display: flex; align-items: start; justify-content: space-between; gap: 20px; }
.project-meta { display: flex; gap: 10px 18px; flex-wrap: wrap; color: var(--muted); margin-top: 7px; }
.activity { display: grid; gap: 0; }
.activity-row { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.activity-row:last-child { border-bottom: 0; }
.activity-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-size: 12px; }
.history-row { display: grid; grid-template-columns: 120px 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); }

.kicker-strip { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: white; padding: 18px 0; }
.kicker-inner { width: min(var(--max), calc(100% - 40px)); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.demo-steps { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; overflow-x: auto; }
.demo-step { white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.demo-step:not(:last-child)::after { content: '→'; color: var(--muted-2); }

.toast { position: fixed; right: 20px; bottom: 20px; background: var(--ink); color: white; border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow-md); opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s ease; z-index: 100; max-width: 340px; }
.toast.show { opacity: 1; transform: none; }

@media (max-width: 1100px) {
  .hero { grid-template-columns: 1fr; gap: 20px; }
  .hero-preview,.flow-shell { max-width: 780px; }
  .lab-grid { grid-template-columns: 210px 1fr; }
  .lab-grid > .panel:last-child { grid-column: 1 / -1; }
  .repair-layout { grid-template-columns: 1fr; }
  .workspace { grid-template-columns: 190px 1fr; }
}

@media (max-width: 900px) {
  .header-nav { display: none; }
  .cap-grid,.summary-grid,.detect-grid { grid-template-columns: 1fr; }
  .workspace { display: block; }

  .side-title { display: none; }
  .side-link { width: auto; white-space: nowrap; }
  .lab-grid { grid-template-columns: 1fr; }
  .lab-grid > .panel:last-child { grid-column: auto; }
  .form-row { grid-template-columns: 1fr; gap: 8px; }
  .evidence-two { grid-template-columns: 1fr; }
  .before-after { grid-template-columns: 1fr; }
  .ba-arrow { transform: rotate(90deg); }
  .secret-row { grid-template-columns: 1fr auto; }
  .secret-value { grid-column: 1 / -1; }
}

@media (max-width: 640px) {
  .page,.header-inner,.kicker-inner { width: min(100% - 24px, var(--max)); }
  .page { padding-top: 24px; }
  h1 { font-size: 40px; }
  .hero { min-height: 0; padding-top: 28px; }
  .header-actions .btn:not(.primary) { display: none; }
  .hero-preview { transform: none; }
  .flow-shell { min-height: 650px; }
  .flow-node { width: calc(100% - 36px); left:18px !important; right:auto !important; transform:none !important; }
  .flow-node.repo { top:26px; }
  .flow-node.requirements { top:126px; }
  .flow-node.sandbox { top:226px; }
  .flow-node.experiment { top:326px; }
  .flow-node.failure { top:426px; }
  .flow-node.repair { top:526px; }
  .flow-lines { display:none; }
  .flow-caption { display:none; }
  .chain-row { grid-template-columns: 1fr auto; }
  .chain-label { grid-column: 1 / -1; }
  .stepper { grid-template-columns: 1fr; gap: 5px; }
  .step { padding: 8px 10px 8px 16px; background: white; border: 1px solid var(--border); border-radius: 8px; }
  .step::before { top: 0; bottom: 0; left: 0; width: 4px; height: auto; right: auto; }
  .issue-header,.project-head,.result-head { display: grid; }
  .repo-row { grid-template-columns: 1fr; }
  .kicker-inner { display: grid; }
  .workspace .page { width: calc(100% - 24px); }
  .lab { width: calc(100% - 16px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .001ms !important; }
}

</style>

</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <main id="app" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
(() => {
  const app = document.getElementById('app');
  const toast = document.getElementById('toast');

  const state = { screen: 'landing' };

  function escapeHtml(value) {
    return String(value)
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#039;');
  }

  function brand() {
    return `<a class="brand" href="#/landing" data-nav="landing" aria-label="VERIFAI home"><span class="brand-mark" aria-hidden="true"></span><span>VERIFAI</span></a>`;
  }

  function appHeader() {
    return `<header class="app-header"><div class="header-inner">
      ${brand()}
      <div class="header-actions" style="margin-left:auto"><span class="muted small">Local only</span></div>
    </div></header>`;
  }

  function localRepositoryFormMarkup() {
    return `<form id="localRepositoryForm" class="card pad-lg" aria-describedby="localRepositoryHelp">
      <label class="label" for="localRepoUrl">Public GitHub repository URL</label>
      <input id="localRepoUrl" name="url" class="input" type="url" required autocomplete="url" placeholder="https://github.com/owner/repository" />
      <p id="localRepositoryHelp" class="help">VERIFAI clones the public repository, one API-backed AI model reviews its files, and one bounded read-only command runs in an on-demand Docker sandbox. The finding includes actual executed evidence. This limited check is not full verification.</p>
      <div class="actions"><button id="startLocalAudit" class="btn primary" type="submit">Start local check</button></div>
      <div id="localRepoResult" role="status" aria-live="polite"></div>
    </form>`;
  }

  function renderLocalLanding() {
    return `${appHeader()}
      <div class="page narrow compact">
        <section class="card pad-lg" style="margin-top:8vh">
          <div class="eyebrow">Local repository check</div>
          <h1>Inspect a public GitHub repository.</h1>
          <p class="lede">Paste a URL. VERIFAI clones it to a temporary directory, reads its tracked files, and shows what it found.</p>
          ${localRepositoryFormMarkup()}
          <p class="tiny muted" style="margin:16px 0 0">Base check: clone, one safe command and one AI call. No installs, repair or pull requests in that base check. Optional security, browser, repair, proof and human-approved PR actions are separately gated.</p>
        </section>
      </div>`;
  }

  async function startLocalRepositoryCheck(form) {
    const buttonEl = form.querySelector('#startLocalAudit');
    const resultEl = form.querySelector('#localRepoResult');
    buttonEl.disabled = true;
    buttonEl.textContent = 'Audit running…';
    delete form.dataset.auditId;
    resultEl.innerHTML = '<p class="muted small">Repository accepted for local audit. Cloning…</p>';
    try {
      const response = await fetch('/api/local/audits', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ url: form.querySelector('#localRepoUrl').value.trim() }),
      });
      const accepted = await response.json();
      if (!response.ok) throw new Error(accepted.error || `HTTP ${response.status}`);
      form.dataset.auditId = accepted.id;
      const deadline = Date.now() + 150000;
      while (Date.now() < deadline) {
        const progress = await fetch(`/api/local/audits/${encodeURIComponent(accepted.id)}`);
        const run = await progress.json();
        if (!progress.ok) throw new Error(run.error || `HTTP ${progress.status}`);
        renderMasterAudit(run, resultEl);
        if (run.status !== 'Running') return;
        await new Promise(resolve => setTimeout(resolve, 250));
      }
      throw new Error('Audit deadline exceeded; status and cleanup are unknown. Check API health.');
    } catch (error) {
      resultEl.innerHTML = `<p class="status failed">Incomplete: ${escapeHtml(error?.message || error)}</p>`;
    } finally {
      buttonEl.disabled = false;
      buttonEl.textContent = 'Start local check';
    }
  }

  function resultTone(value) {
    return { Completed: 'verified', VerifiedRepair: 'verified', Running: 'running', Failed: 'failed', Incomplete: 'failed', RejectedRepair: 'failed' }[value] || 'unknown';
  }

  function factTone(value) {
    return { verified: 'good', failed: 'bad', running: 'warn' }[resultTone(value)] || '';
  }

  function resultBadge(value, label) {
    return `<span class="status ${resultTone(value)}">${escapeHtml(label || value || 'Unknown')}</span>`;
  }

  function chip(label, value) {
    if (value === undefined || value === null || value === '') return '';
    return `<span class="chip">${escapeHtml(label)} <b>${escapeHtml(value)}</b></span>`;
  }

  function monoChip(label, value) {
    if (!value) return '';
    return `<span class="chip mono">${escapeHtml(label)} <b>${escapeHtml(value)}</b></span>`;
  }

  function fact(label, value, tone, mono) {
    const shown = value === undefined || value === null || value === '' ? 'Missing' : value;
    return `<div class="fact${tone ? ` ${tone}` : ''}"><dt>${escapeHtml(label)}</dt><dd${mono ? ' class="mono"' : ''}>${escapeHtml(shown)}</dd></div>`;
  }

  function factGrid(facts) {
    const cells = facts.filter(Boolean);
    return cells.length ? `<dl class="fact-grid">${cells.join('')}</dl>` : '';
  }

  function evidenceCard(id, title, badge, body) {
    return `<section${id ? ` id="${escapeHtml(id)}"` : ''} class="card pad section evidence-card"><h4>${escapeHtml(title)}${badge || ''}</h4>${body}</section>`;
  }

  function sandboxDisplay(value) {
    if (value === true) return 'yes';
    if (value === false) return 'no';
    return 'Not reported';
  }

  function hashChip(label, full) {
    if (!full) return '';
    const prefix = String(full).slice(0, 12);
    return `${monoChip(label, prefix)}<code class="wrap-anywhere">${escapeHtml(String(full))}</code>`;
  }

  function renderMasterAudit(run, host) {
    const statusText = run.status === 'Completed' ? 'Completed limited check' : run.status;
    const stages = Object.entries(run.stages || {}).map(([name, stage]) => `<li class="fact ${factTone(stage.status)}"><strong>${escapeHtml(name)}: ${escapeHtml(stage.status)}</strong>${stage.detail ? `<p class="evidence-note">${escapeHtml(stage.detail)}${Number.isFinite(stage.durationMs) ? ` · ${escapeHtml(String(stage.durationMs))} ms` : ''}</p>` : ''}</li>`).join('');
    const finding = run.finding;
    const execution = run.execution;
    const specialist = run.specialists?.results?.find(item => item.id === 'security');
    const proof = run.proof;
    const browser = run.browser;
    const repair = run.repair;
    const stdoutText = execution?.stdout || '';
    const stderrText = execution?.stderr || '';
    const stdoutLines = stdoutText ? stdoutText.split('\n').length : 0;
    const stderrLines = stderrText ? stderrText.split('\n').length : 0;
    const scopeText = finding?.assessment?.scope || finding?.executedCheck?.scope || 'limited-check: single bounded command — not a test suite, not security verification';
    const coverageText = repair?.coverage?.label || '';
    const findingState = finding?.assessment?.findingState || 'Unconfirmed';
    const repairFiles = Array.isArray(repair?.changedFiles) ? repair.changedFiles : [];
    const repairFilesMarkup = repairFiles.length ? `<p class="evidence-sub">Changed files (${repairFiles.length})</p><ul class="artifact-list">${repairFiles.map(file => `<li><span class="artifact-name">${escapeHtml(file.path || 'missing')}</span>${file.beforeHash ? hashChip('before',file.beforeHash) : '<span class="evidence-note">before hash Missing</span>'}${file.afterHash ? hashChip('after',file.afterHash) : '<span class="evidence-note">after hash Missing</span>'}</li>`).join('')}</ul>` : '<p class="evidence-note">No changed file was recorded.</p>';
    const repairDiffMarkup = repair?.diff ? `<details><summary>Diff · ${escapeHtml(String(repair.diff.length))} chars</summary><pre class="local-log-block wrap-anywhere" style="white-space:pre-wrap;overflow-wrap:anywhere">${escapeHtml(repair.diff.slice(0, 4000))}${repair.diff.length > 4000 ? '\n...[truncated]' : ''}</pre></details>` : '';
    const repairMarkup = repair?.verdict === 'VerifiedRepair' ? `<section id="localRepairAction" class="card pad section">
      <h4>Verified repair</h4>
      <p class="status verified">VerifiedRepair · before exit ${escapeHtml(String(repair.before?.exitCode))} · after exit ${escapeHtml(String(repair.after?.exitCode))}</p>
      <p class="tiny muted wrap-anywhere">Verified target: <code class="wrap-anywhere">${escapeHtml(repair.verifiedTarget?.command || repair.before?.command || run.selectedCommand || '')}</code> · exit ${escapeHtml(String(repair.verifiedTarget?.exitCode ?? repair.before?.exitCode ?? ''))}</p>
      ${repair.verifiedBaseCommitSha ? `<p class="tiny muted wrap-anywhere">Verified base: <code class="wrap-anywhere">${escapeHtml(repair.verifiedBaseCommitSha)}</code></p>` : '<p class="tiny muted wrap-anywhere">Verified base: Missing</p>'}
      <p class="tiny muted wrap-anywhere">Original unchanged: ${repair.originalUnchanged === true ? 'yes' : repair.originalUnchanged === false ? 'no' : 'Not reported'}</p>
      ${coverageText ? `<p class="tiny muted wrap-anywhere">${escapeHtml(coverageText)}</p>` : `<p class="tiny muted wrap-anywhere">Regressions run: ${escapeHtml(String(repair.regressions?.length ?? 0))} · coverage Not reported (not assumed SAME-COMMAND)</p>`}
      ${repair.error ? `<p class="status failed wrap-anywhere">${escapeHtml(repair.error)}</p>` : ''}
      ${repairFilesMarkup}
      ${repairDiffMarkup}
      <p class="tiny muted">Review proof first. Creating a PR requires this explicit human action and revalidates the immutable repair, proof manifest, and remote base.</p>
      <div class="actions"><button class="btn primary sm" data-action="create-local-pr" data-audit-id="${escapeHtml(run.id)}">Create PR</button></div>
      <div id="localPrResult" role="status" aria-live="polite">${run.pullRequest?.pullRequest?.url ? `<a class="wrap-anywhere" href="${escapeHtml(run.pullRequest.pullRequest.url)}" target="_blank" rel="noopener">Open created PR</a>` : ''}</div>
    </section>` : execution?.status === 'Failed' && execution?.sandbox?.started === true && execution.executed !== false && execution.timedOut !== true && execution.aborted !== true && Number.isInteger(execution?.exitCode) && execution.exitCode !== 0 ? `<section id="localRepairAction" class="card pad section">
      <h4>Repair candidate</h4>
      <p class="tiny muted">Deliberate action only. Paste one bounded candidate patch; VERIFAI tests it in an isolated copy and never edits the original checkout.</p>
      <textarea id="localRepairPatch" rows="5" class="input" spellcheck="false" placeholder='{"files":[{"path":"file.js","expected":"old","replacement":"new"}]}'></textarea>
      <div class="actions"><button class="btn primary sm" data-action="repair-local-audit" data-audit-id="${escapeHtml(run.id)}">Verify repair</button></div>
      <div id="localRepairResult" role="status" aria-live="polite"></div>
    </section>` : '';
    const proofPresent = proof?.artifacts ? proof.artifacts.filter(item => item.status === 'Present').length : 0;
    const proofMissing = proof?.artifacts ? proof.artifacts.filter(item => item.status === 'Missing').length : 0;
    const proofBadge = !proof?.artifacts ? '' : proofPresent > 0 && proofMissing === 0 ? ' <span class="status verified">Complete</span>' : proofPresent === 0 ? ' <span class="status failed">Missing</span>' : ' <span class="status warning">Partial</span>';
    const proofMarkup = proof?.artifacts ? `<section id="localProofArtifacts" class="card pad section">
      <h4>Proof artifacts${proofBadge}</h4>
      <p class="tiny muted wrap-anywhere">Proof manifest <code class="wrap-anywhere">${escapeHtml(proof.manifest?.id || 'missing')}</code></p>
      <p class="tiny muted wrap-anywhere">SHA-256 <code class="wrap-anywhere">${escapeHtml(proof.manifest?.sha256 || 'missing')}</code> · ${proofPresent} present · ${proofMissing} missing</p>
      <p class="tiny muted">Materialized server-owned report data is downloadable; this includes unconfirmed hypotheses, not independent proof of their claims. Missing steps stay labelled Missing.</p>
      <ul>${proof.artifacts.map(item => item.status === 'Present'
        ? `<li><span class="status verified">Present</span> ${escapeHtml(item.name)} · ${escapeHtml(item.path || '')} · <span>SHA-256</span> <code class="wrap-anywhere">${escapeHtml(item.sha256 || '')}</code> · <a class="wrap-anywhere" href="/api/local/audits/${encodeURIComponent(run.id)}/artifacts/${encodeURIComponent(item.path)}" target="_blank" rel="noopener">Download ${escapeHtml(item.name)}</a></li>`
        : `<li><span class="status unknown">Missing</span> ${escapeHtml(item.name)}${item.reason ? ` — ${escapeHtml(item.reason)}` : ''}</li>`).join('')}</ul>
    </section>` : proof ? `<section id="localProofArtifacts" class="card pad section">
      <h4>Proof artifacts <span class="status failed">Incomplete</span></h4>
      <p class="status failed wrap-anywhere">Incomplete: ${escapeHtml(proof.error || 'proof bundle not published')}</p>
    </section>` : '';
    const cleanup = run.cleanup || {};
    const repairCleanup = repair?.cleanup || {};
    const cleanupRow = (label, value) => `<div><span class="tiny muted">${escapeHtml(label)}</span><br><strong>${value === true ? 'true' : value === false ? 'false' : 'missing'}</strong></div>`;
    const MAX_BROWSER_ROWS = 20;
    const browserConsole = browser?.consoleErrors || browser?.console || [];
    const browserNetwork = browser?.networkEvidence || browser?.network || [];
    const KNOWN_CONSOLE_KEYS = ['method', 'level', 'text', 'message', 'url', 'location'];
    const consoleShown = browserConsole.slice(0, MAX_BROWSER_ROWS);
    const consoleMarkup = consoleShown.map((entry, i) => {
      const log = entry?.params?.entry;
      const args = entry?.params?.args;
      const argumentText = Array.isArray(args) ? args.map(arg => arg?.value ?? arg?.description ?? '').join(' ') : undefined;
      const text = entry?.text ?? entry?.message ?? log?.text ?? argumentText ?? (typeof entry === 'string' ? entry : 'Missing text');
      const location = entry?.url ?? entry?.location ?? log?.url ?? entry?.params?.stackTrace?.callFrames?.[0]?.url ?? 'Missing location';
      const level = entry?.level ?? log?.level ?? entry?.params?.type ?? entry?.method ?? 'Missing level';
      const rest = entry && typeof entry === 'object' ? Object.fromEntries(Object.entries(entry).filter(([k]) => !KNOWN_CONSOLE_KEYS.includes(k))) : null;
      const fullPretty = rest && Object.keys(rest).length ? JSON.stringify(rest, null, 2) : '';
      const pretty = fullPretty.slice(0, 2000);
      return `<div><p class="tiny muted wrap-anywhere">Row ${i + 1} · ${escapeHtml(String(level))}</p><p class="wrap-anywhere">${escapeHtml(String(text))}</p><p class="tiny muted wrap-anywhere">${escapeHtml(String(location))}</p>${pretty ? `<details><summary>Row ${i + 1} full fields</summary><pre class="local-log-block wrap-anywhere">${escapeHtml(pretty)}${fullPretty.length > 2000 ? '\n...[truncated]' : ''}</pre></details>` : ''}</div>`;
    }).join('');
    const consoleExtra = browserConsole.length > consoleShown.length ? `<p class="tiny muted">${browserConsole.length - consoleShown.length} more console rows not shown (showing ${consoleShown.length} of ${browserConsole.length}).</p>` : '';
    const networkShown = browserNetwork.slice(0, MAX_BROWSER_ROWS);
    const networkMarkup = networkShown.map((row, i) => {
      const status = row?.status ?? row?.params?.response?.status ?? row?.response?.status;
      const url = row?.url ?? row?.params?.request?.url ?? row?.params?.response?.url ?? row?.request?.url;
      const method = row?.method ?? row?.params?.request?.method ?? row?.request?.method;
      const fullPretty = JSON.stringify(row ?? null, null, 2);
      const pretty = fullPretty.slice(0, 2000);
      return `<div><p class="wrap-anywhere">${escapeHtml(url != null ? String(url) : 'Missing')}</p><p class="tiny muted wrap-anywhere">Status: ${escapeHtml(status != null ? String(status) : 'not-reported')}${method ? ` · ${escapeHtml(String(method))}` : ''}</p><details><summary>Row ${i + 1} full fields</summary><pre class="local-log-block wrap-anywhere">${escapeHtml(pretty)}${fullPretty.length > 2000 ? '\n...[truncated]' : ''}</pre></details></div>`;
    }).join('');
    const networkExtra = browserNetwork.length > networkShown.length ? `<p class="tiny muted">${browserNetwork.length - networkShown.length} more network rows not shown (showing ${networkShown.length} of ${browserNetwork.length}).</p>` : '';
    const browserCleanup = browser?.cleanup && typeof browser.cleanup === 'object' ? browser.cleanup : null;
    const cleanupFact = (label, value) => `<div><span class="tiny muted">${escapeHtml(label)}</span><br><strong>${value === true ? 'true' : value === false ? 'false' : 'missing'}</strong></div>`;
    const browserAssertion = browser?.assertion || (Array.isArray(browser?.assertions) ? browser.assertions[0] : null);
    host.innerHTML = `<section class="card pad section result-root" data-audit-id="${escapeHtml(run.id)}">
      <h3 class="wrap-anywhere">${escapeHtml(run.repository?.fullName || 'Public GitHub repository')}</h3>
      <p id="localAuditStatus" class="status ${run.status === 'Running' ? 'running' : run.status === 'Completed' ? 'unknown' : 'failed'}">${escapeHtml(statusText)}</p>
      <section id="localSummary" class="card pad section result-summary evidence-card" aria-label="Result summary">
        <h4>Summary ${resultBadge(run.status,statusText)} ${repair?.verdict ? resultBadge(repair.verdict,`Repair ${repair.verdict}`) : ''}</h4>
        <div class="result-chips">
          ${chip('Audit id',run.id || 'Missing')}
          ${chip('Commit',run.repository?.commit || 'Missing')}
          ${chip('Tracked files',String(run.files?.count ?? 'Missing'))}
          ${chip('Model',run.model ? `${run.model.provider} · ${run.model.model}` : 'Missing')}
          ${chip('Duration',run.durationMs != null ? `${run.durationMs} ms` : 'Missing')}
        </div>
      </section>
      ${run.clone?.success ? `<p id="localCloneStatus">Clone succeeded · ${run.files.count} tracked files${run.stages?.cleanup?.status === 'Completed' ? ' · temporary repository cleaned' : ''}</p>` : ''}
      ${evidenceCard('localAuditStagesCard','Stages',resultBadge(run.status),`<ol id="localAuditStages" class="fact-grid stage-facts">${stages}</ol>`)}
      ${run.error ? `<p class="status failed wrap-anywhere">${escapeHtml(run.failedStage)}: ${escapeHtml(run.error)}</p>` : ''}
      <div id="localFinding" role="status" aria-live="polite">
        ${finding ? `<section id="localHypothesis" class="card pad section">
          <h4>Model hypothesis · Unconfirmed (opinion, not verification)</h4>
          <h3 id="localFindingTitle" class="wrap-anywhere">${escapeHtml(finding.title)}</h3>
          <span id="localFindingSeverity" class="status warning">${escapeHtml(finding.severity)}</span>
          <p class="tiny muted">Confidence: Unconfirmed · finding state: ${escapeHtml(findingState)}</p>
          <p id="localFindingDescription" class="wrap-anywhere" style="white-space:pre-wrap">${escapeHtml(finding.description)}</p>
          <p id="localFindingEvidence">Evidence file: <code class="wrap-anywhere">${escapeHtml(finding.evidence?.file || 'missing')}</code></p>
          ${finding?.assessment?.reason ? `<p class="tiny muted wrap-anywhere">${escapeHtml(finding.assessment.reason)}</p>` : ''}
        </section>` : ''}
        ${run.model ? `<p class="wrap-anywhere">Base model · ${escapeHtml(run.model.provider)} · ${escapeHtml(run.model.model)}</p>` : ''}
      </div>
      ${specialist ? `<section id="localSecuritySpecialist" class="card pad section">
        <h4>Security specialist</h4>
        <p class="status ${specialist.status === 'Completed' ? 'unknown' : 'failed'}">${escapeHtml(specialist.status)}</p>
        ${specialist.model ? `<p class="wrap-anywhere">${escapeHtml(specialist.model.provider)} · ${escapeHtml(specialist.model.model)}</p>` : ''}
        ${specialist.error ? `<p class="status failed wrap-anywhere">${escapeHtml(specialist.error)}</p>` : ''}
        <p>${specialist.findings?.length || 0} persisted finding(s) · ${specialist.evidenceRefs?.length || 0} evidence ref(s)</p>
      </section>` : ''}
      ${execution ? `<section id="localExecutionEvidence" class="card pad section">
        <h4>Executed check (server-owned)</h4>
        <p class="tiny muted wrap-anywhere">${escapeHtml(scopeText)}</p>
        <p id="localExecutionSource" class="tiny muted wrap-anywhere">Source: ${escapeHtml(execution.source || 'Missing')}</p>
        <p><span class="tiny muted">Command</span></p><pre class="local-log-block wrap-anywhere" style="white-space:pre-wrap;overflow-wrap:anywhere"><code class="wrap-anywhere">${escapeHtml(execution.command || 'missing')}</code></pre>
        <p>Exit: ${escapeHtml(String(execution.exitCode))} · ${execution.durationMs} ms · ${escapeHtml(execution.status)}</p>
        <p id="localSandboxEvidence" class="wrap-anywhere">Docker sandbox ${execution.sandbox?.started === true ? 'started' : execution.sandbox?.started === false ? 'not started' : 'status Not reported'} · ${execution.sandbox?.removed === true ? 'Removed after execution' : execution.sandbox?.removed === false ? 'Incomplete cleanup' : 'Cleanup Not reported'}</p>
        ${factGrid([
          fact('container',execution.sandbox?.name,undefined,true),
          fact('started',sandboxDisplay(execution.sandbox?.started)),
          fact('removed',sandboxDisplay(execution.sandbox?.removed)),
          fact('memory',execution.sandbox?.memoryBytes ? `${execution.sandbox.memoryBytes / 1048576} MiB limit` : 'Not reported'),
          fact('CPU',execution.sandbox?.nanoCpus ? `${execution.sandbox.nanoCpus / 1e9} CPUs` : 'Not reported'),
          fact('privileged',sandboxDisplay(execution.sandbox?.privileged)),
          fact('network',execution.sandbox?.network || 'Not reported'),
        ])}
        <details><summary>stdout · ${stdoutText.length} chars · ${stdoutLines} lines</summary><pre class="local-log-block wrap-anywhere" style="white-space:pre-wrap;overflow-wrap:anywhere">${escapeHtml(execution.stdout || '(empty)')}</pre></details>
        <details><summary>stderr · ${stderrText.length} chars · ${stderrLines} lines</summary><pre class="local-log-block wrap-anywhere" style="white-space:pre-wrap;overflow-wrap:anywhere">${escapeHtml(execution.stderr || '(empty)')}</pre></details>
        ${execution.truncated ? '<p>Output capped: showing tail only.</p>' : ''}
        <p class="wrap-anywhere">Executed-output SHA-256: <code class="wrap-anywhere">${escapeHtml(run.outputHash || 'missing')}</code></p>
      </section>` : ''}
      ${coverageText && !repair ? `<p class="tiny muted wrap-anywhere">${escapeHtml(coverageText)}</p>` : ''}
      ${browser ? `<section id="localBrowserJourney" class="card pad section"><h4>Browser journey <span class="status unknown">Fixture only</span></h4><p class="wrap-anywhere">${escapeHtml(browser.status)} · Local integration fixture; not verification of the cloned application</p>${browser.error ? `<p class="status failed wrap-anywhere">${escapeHtml(browser.error)}</p>` : ''}${browserAssertion ? `<p class="wrap-anywhere">Click assertion: expected ${escapeHtml(String(browserAssertion.expected ?? 'Missing'))} · observed ${escapeHtml(String(browserAssertion.observed ?? 'Missing'))} · ${browserAssertion.passed === true ? 'Passed' : 'Incomplete'}</p>` : '<p class="tiny muted">Click assertion: Missing (not reported)</p>'}${browser.screenshotRefs?.[0] ? `<a class="btn sm wrap-anywhere" href="${escapeHtml(browser.screenshotRefs[0])}" target="_blank" rel="noopener">Open server screenshot (fixture scope only)</a>` : '<p>Screenshot: Missing (not captured)</p>'}<details><summary>Console rows (${browserConsole.length})</summary>${consoleMarkup || '<p class="tiny muted">No console rows reported.</p>'}${consoleExtra}</details><details><summary>Network rows (${browserNetwork.length})</summary>${networkMarkup || '<p class="tiny muted">No network rows reported.</p>'}${networkExtra}</details><div class="local-summary-grid">${cleanupFact('browserClosed', browserCleanup?.browserClosed)}${cleanupFact('profileRemoved', browserCleanup?.profileRemoved)}${cleanupFact('fixtureStopped', browserCleanup?.fixtureStopped)}</div>${browserCleanup?.error ? `<p class="status failed wrap-anywhere">${escapeHtml(browserCleanup.error)}</p>` : ''}</section>` : ''}
      ${repairMarkup}
      ${proofMarkup}
      <section id="localCleanup" class="card pad section" aria-label="Cleanup facts">
        <h4>Cleanup</h4>
        <div class="local-summary-grid">
          ${cleanupRow('repositoryRemoved', cleanup.repositoryRemoved)}
          ${cleanupRow('sandboxRemoved', cleanup.sandboxRemoved)}
          ${cleanupRow('candidateRemoved', repairCleanup.candidateRemoved ?? cleanup.candidateRemoved)}
          ${cleanupRow('originalUnchanged', repair?.originalUnchanged ?? cleanup.originalUnchanged)}
        </div>
      </section>
      <p class="tiny muted">A completed limited check is not a full test-suite or security verification. Cleanup is automatic.</p>
      ${run.status === 'Completed' ? `<section class="card pad section">
        <button class="btn" type="button" data-action="run-fixture-browser" data-audit-id="${escapeHtml(run.id)}">Run fixture browser journey</button>
        <p class="tiny muted">One button-click integration fixture, not verification of the cloned application. Chrome starts on demand and closes after evidence capture.</p>
        <div id="localBrowserEvidence" role="status" aria-live="polite"></div>
      </section>` : ''}
    </section>`;

  }

  async function runFixtureBrowser(button) {
    let host = document.getElementById('localBrowserEvidence');
    const masterButton = document.getElementById('startLocalAudit');
    button.disabled = true;
    if (masterButton) masterButton.disabled = true;
    host.textContent = 'Running isolated fixture browser journey…';
    try {
      const response = await fetch(`/api/local/audits/${encodeURIComponent(button.dataset.auditId)}/browser`, { method: 'POST' });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
      const latestResponse = await fetch(`/api/local/audits/${encodeURIComponent(button.dataset.auditId)}`);
      if (!latestResponse.ok) throw new Error('Evidence refresh incomplete');
      renderMasterAudit(await latestResponse.json(), document.getElementById('localRepoResult'));
      host = document.getElementById('localBrowserEvidence');
      if (host) host.innerHTML = `<p id="localBrowserStatus" class="status ${result.status === 'Completed' ? 'unknown' : 'failed'}">${escapeHtml(result.status)} fixture journey recorded above</p><p class="tiny muted">Full fixture evidence is in the Browser journey card above (server-owned record).</p>`;
    } catch (error) { host.textContent = `Incomplete: ${error.message}`; }
    finally { button.disabled = false; if (masterButton) masterButton.disabled = false; }
  }

  async function verifyLocalRepair(auditId, buttonEl) {
    const host=document.getElementById('localRepairResult');
    const input=document.getElementById('localRepairPatch');
    buttonEl.disabled=true;
    try {
      const patch=JSON.parse(input?.value || '{}');
      const response=await fetch(`/api/local/audits/${encodeURIComponent(auditId)}/repair`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({patch})});
      const result=await response.json();
      if(!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
      host.innerHTML=`<p class="status ${result.verdict==='VerifiedRepair'?'verified':result.verdict==='RejectedRepair'?'failed':'unknown'}">${escapeHtml(result.verdict)}</p><p class="tiny muted">Before exit ${escapeHtml(String(result.before?.exitCode))} · After exit ${escapeHtml(String(result.after?.exitCode))} · Original unchanged: ${escapeHtml(String(result.originalUnchanged))}</p>`;
      const latest=await fetch(`/api/local/audits/${encodeURIComponent(auditId)}`);
      if(!latest.ok) throw new Error('Repair evidence refresh incomplete');
      renderMasterAudit(await latest.json(),document.getElementById('localRepoResult'));
    } catch(error) {
      host.innerHTML=`<p class="status failed">Incomplete: ${escapeHtml(error?.message || error)}</p>`;
    } finally { buttonEl.disabled=false; }
  }

  async function createLocalPullRequest(auditId, buttonEl) {
    const host=document.getElementById('localPrResult');
    buttonEl.disabled=true;
    try {
      const response=await fetch(`/api/local/audits/${encodeURIComponent(auditId)}/pr`,{method:'POST'});
      const result=await response.json();
      if(!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
      const url=result.pullRequest?.url;
      host.innerHTML=url?`<p class="status verified">PR created</p><a href="${escapeHtml(url)}" target="_blank" rel="noopener">Open pull request</a>`:'<p class="status verified">PR created</p>';
    } catch(error) {
      host.innerHTML=`<p class="status failed">Incomplete: ${escapeHtml(error?.message || error)}</p>`;
      buttonEl.disabled=false;
    }
  }

  async function cleanupLocalRepository(id, buttonEl) {
    buttonEl.disabled = true;
    try {
      const response = await fetch(`/api/local/repositories/${encodeURIComponent(id)}/cleanup`, { method: 'POST' });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      const resultEl = document.getElementById('localRepoResult');
      resultEl.querySelector('#localCloneStatus').textContent = 'Temporary clone cleaned up';
      resultEl.querySelector('#localCloneStatus').className = 'status unknown';
      resultEl.querySelector('#localWorkspacePath')?.remove();
      buttonEl.remove();
      const form = document.getElementById('localRepositoryForm');
      if (form) {
        delete form.dataset.repositoryId;
        const startButton = form.querySelector('#startLocalAudit');
        startButton.disabled = false;
        startButton.textContent = 'Start local check';
      }
    } catch (error) {
      buttonEl.disabled = false;
      showToast(`Cleanup failed: ${String(error?.message || error)}`);
    }
  }

  const renderers = { landing: renderLocalLanding };

  function navigate(screen, push = true) {
    if (screen !== 'landing') return;
    state.screen = screen;
    if (push && location.hash !== `#/${screen}`) location.hash = `#/${screen}`;
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  function render() {
    const renderer = renderers[state.screen] || renderers.landing;
    app.innerHTML = renderer();
    app.classList.remove('route-enter');
    void app.offsetWidth;
    app.classList.add('route-enter');
    document.title = 'Local repository check — VERIFAI';
  }

  document.addEventListener('submit', (event) => {
    const repositoryForm = event.target.closest('#localRepositoryForm');
    if (repositoryForm) {
      event.preventDefault();
      startLocalRepositoryCheck(repositoryForm);
    }
  });

  document.addEventListener('click', (event) => {
    const fixtureBrowser = event.target.closest('[data-action="run-fixture-browser"]');
    if (fixtureBrowser) { event.preventDefault(); runFixtureBrowser(fixtureBrowser); return; }
    const createPr = event.target.closest('[data-action="create-local-pr"]');
    if (createPr) {
      event.preventDefault();
      createLocalPullRequest(createPr.dataset.auditId, createPr);
      return;
    }
    const repairAudit = event.target.closest('[data-action="repair-local-audit"]');
    if (repairAudit) {
      event.preventDefault();
      verifyLocalRepair(repairAudit.dataset.auditId, repairAudit);
      return;
    }
    const cleanupRepository = event.target.closest('[data-action="cleanup-local-repository"]');
    if (cleanupRepository) {
      cleanupLocalRepository(cleanupRepository.dataset.repositoryId, cleanupRepository);
      return;
    }
    const nav = event.target.closest('[data-nav]');
    if (nav) {
      event.preventDefault();
      navigate(nav.dataset.nav);
      return;
    }
  });

  let headerScrollQueued=false;
  window.addEventListener('scroll',()=>{if(headerScrollQueued)return;headerScrollQueued=true;requestAnimationFrame(()=>{document.querySelector('.app-header')?.classList.toggle('scrolled',window.scrollY>10);headerScrollQueued=false})},{passive:true});

  window.VERIFAI = { navigate, render, state };
  render();
})();
</script>

</body>
</html>
