name: VERIFAI CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Build bounded local audit sandbox
        run: docker build -t verifai-local-audit:m4 -f infra/local/audit.Dockerfile infra/local
      - name: Run structural E2E and optional real-provider E2E
        env:
          VERIFIAI_RUN_AWS_E2E: "0"
        run: node scripts/ci-local-e2e.mjs
      - if: always()
        run: npm run ops:test
